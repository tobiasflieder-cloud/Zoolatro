<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12301f">
<meta name="description" content="Zoolatro: Baue deinen Zoo, Karte für Karte.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoolatro">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{margin:0}body{font:14px system-ui,sans-serif;-webkit-touch-callout:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zoolatro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: one screen, no scrolling. Phone: stacked column (bar, counters, info, park, actions, hand). Wide screens: park left, controls + full cards + day log right. Single committed dark "jungle at dusk" look. */
:root{
  --bg:#12301f; --panel:#1a3f2a; --panel2:#224d33;
  --tile:#3b7447; --tile2:#427d4e; --tile3:#356b40; --path:#c9b688; --rock:#1c201b; --rock-line:#ffffff24;
  --paper:#f4efe1; --ink:#1d2a21;
  --text:#eaf2e3; --muted:#9fbba5;
  --attr:#ff9f1c; --schutz:#2ec4b6; --bad:#ff5a5f; --gold:#ffd166;
  --c-gehege:#86c96f; --c-attr:#ff7a98; --c-essen:#ffcf4a; --c-schutz:#b49af0;
  --h-wasser:#5cbfe3; --h-savanne:#e2c46e; --h-wald:#7cc860; --h-wueste:#e8a070;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.3;
  background-image:radial-gradient(circle at 20% 0%,#1d4a31 0,transparent 55%),radial-gradient(circle at 100% 100%,#0d2518 0,transparent 60%);
  -webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:6px}
.side{display:contents}
.top{order:1}.goal{order:2}.counters{order:3}.infowrap{order:4}.boardarea{order:5}.actions{order:6}.handbar{order:7}.hand{order:8}.log{display:none}

.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.5px;color:var(--gold);line-height:1}
.season{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.season-name{font-family:var(--f-display);font-size:15px;white-space:nowrap}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--gold);border-color:var(--gold)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 3px #ffd16633}
.icbtn{border:0;background:var(--panel2);color:var(--text);width:32px;height:32px;border-radius:9px;font-size:15px;font-weight:600;flex:none}

.goal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.goal b{color:var(--text);font-weight:600}
.bar{flex:1;height:8px;border-radius:6px;background:#0c2216;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffb347);border-radius:6px;transition:width .5s ease}
.bar.full i{background:linear-gradient(90deg,#7ee081,var(--gold))}

.counters{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;align-items:center;gap:5px}
.cnt{border-radius:10px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.cnt label{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt span{font-family:var(--f-display);font-size:23px;line-height:1.05;display:block}
.cnt small{display:block;font-size:10px;min-height:12px;line-height:1.2;opacity:.9}
.cnt.a{background:var(--attr);color:#3a1d00}
.cnt.s{background:var(--schutz);color:#00302b}
.cnt.t{background:var(--panel2);border:2px solid #ffffff1a}
.cnt.t span{color:var(--gold)}
.op{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.cnt.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.14)}}

.infowrap{position:relative;height:66px;flex:none;z-index:6}
.info{position:absolute;left:0;right:0;top:0;background:var(--panel);border-radius:10px;padding:6px 10px;min-height:66px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 20px #0007}
.info h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.15}
.info p{margin:0;font-size:12.5px}
.info .hint{color:var(--muted)}
.tag{font-family:var(--f-body);font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;color:var(--ink);letter-spacing:.02em}
.vals{display:flex;gap:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.chip.a{background:#ff9f1c33;color:var(--attr)} .chip.s{background:#2ec4b633;color:var(--schutz)} .chip.n{background:#ffffff14;color:var(--muted)}
.chip.bad{background:#ff5a5f33;color:#ffb3b5}

.boardarea{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.boardwrap{position:relative;aspect-ratio:var(--ar,1);width:min(100cqw,calc(100cqh * var(--ar,1)))}
.boardwrap.zoomed{overflow:hidden;border-radius:12px;box-shadow:inset 0 0 0 2px #ffd16655}
.boardwrap.zoomed #board{cursor:grab}
.zoombtn{position:absolute;bottom:4px;left:4px;z-index:7;width:34px;height:34px;border-radius:50%;border:0;background:#0f2518d9;color:var(--text);font-size:16px;box-shadow:0 2px 8px #0006}
.zoomed .zoombtn{background:var(--gold)}
.minimap{position:absolute;right:6px;bottom:6px;width:72px;height:auto;z-index:7;background:#0f2518d9;border-radius:8px;padding:3px;display:none;pointer-events:none}
.zoomed .minimap{display:none}
.minimap .mc{fill:var(--tile)} .minimap .mc.block{fill:var(--rock)} .minimap .mv{fill:#ffd16622;stroke:var(--gold);stroke-width:4}
#board{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent}
#board .base{fill:var(--path)}
#board .cell{fill:var(--tile);cursor:pointer;transition:fill .15s}
#board .cell.t1{fill:var(--tile2)} #board .cell.t2{fill:var(--tile3)}
#board .cell:hover{fill:#4d8f5a}
#board .terr{cursor:pointer}
#board .terr.wasser{fill:var(--h-wasser)} #board .terr.savanne{fill:var(--h-savanne)} #board .terr.wald{fill:var(--h-wald)} #board .terr.wueste{fill:var(--h-wueste)}
#board .block{fill:var(--rock)} #board .hatch{fill:url(#hatch)} #board .hatch line{stroke:var(--rock-line);stroke-width:1.1}

#board .tic{font-size:6px;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:.8}
#board .tic.blk{font-size:11px;opacity:.9}
#board .bld{cursor:pointer;transform-box:fill-box;transform-origin:center}
.hx{stroke-width:.8}
.fence{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
#board .ic{font-size:9px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#board .ic.big{font-size:12px}
#board .natdot{fill:#ffffffaa;pointer-events:none}
.hab-wasser .hx{fill:var(--h-wasser);stroke:var(--h-wasser)} .hab-savanne .hx{fill:var(--h-savanne);stroke:var(--h-savanne)}
.hab-wald .hx{fill:var(--h-wald);stroke:var(--h-wald)} .hab-wueste .hx{fill:var(--h-wueste);stroke:var(--h-wueste)}
.cat-attr .hx,.cat-essen .hx,.cat-schutz .hx{fill:var(--paper);stroke:var(--paper)}
.cat-attr .fence{stroke:var(--c-attr);stroke-width:2.2} .cat-essen .fence{stroke:var(--c-essen);stroke-width:2.2} .cat-schutz .fence{stroke:var(--c-schutz);stroke-width:2.2}
#board .bld.pulse{animation:pulse .32s ease}
@keyframes pulse{40%{transform:scale(1.08)}}
#board .bld.sel .fence,#board .bld.hl .fence{stroke:var(--gold);stroke-width:2.2}
#board .bld.hlneg .fence{stroke:var(--bad);stroke-width:2.2}
#board .ghost{cursor:pointer;animation:bob 1.2s ease-in-out infinite}
#board .ghost .hx{opacity:.85}
#board .ghost .fence{stroke-dasharray:2 1.5}
#board .ghost.bad .hx{fill:var(--bad);stroke:var(--bad)}
@keyframes bob{50%{transform:translateY(-1.5px)}}
#board .link{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:3 2;fill:none;stroke-linecap:round;animation:dash .8s linear infinite;pointer-events:none}
#board .link.neg{stroke:var(--bad)}
#board .link.flash{animation:dash .8s linear infinite,fadeout .9s ease forwards}
#board .ldot{fill:var(--gold);pointer-events:none} #board .ldot.neg{fill:var(--bad)}
@keyframes dash{to{stroke-dashoffset:-10}}
@keyframes fadeout{0%,60%{opacity:1}to{opacity:0}}

.fxh{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:17px;z-index:5;
  text-shadow:0 2px 0 #0009;animation:rise .95s ease-out forwards;white-space:nowrap}
.float.a{color:var(--attr)} .float.s{color:var(--schutz);margin-top:17px} .float.neg{color:var(--bad)} .float.m{color:var(--gold);font-size:21px}
@keyframes rise{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,calc(-50% - 32px))}}
.badge{position:absolute;transform:translate(-50%,-135%);background:var(--ink);border:2px solid var(--gold);border-radius:8px;
  padding:1px 5px;font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px #0007;z-index:4}
.badge.neg{border-color:var(--bad)}
.badge.flash{animation:fadeout 1s ease forwards}
.badge .a{color:var(--attr)} .badge .s{color:var(--schutz)} .badge .n{color:#ffb3b5}
.skiphint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}

.actions{display:flex;gap:7px;flex:none}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.main{background:var(--gold);color:#3a2a00;flex:1;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.3px}
.btn.sub{background:var(--panel2);color:var(--text)}
.btn.go{background:#7ee081;color:#0e2e14}
.btn:disabled{opacity:.4;cursor:default}

.handbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;font-size:12px;color:var(--muted);font-weight:600}
.bp{display:flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:uppercase}
.bp i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);margin-left:2px}
.bp i.on{background:var(--gold)}
.deckbtn{border:0;background:var(--panel2);color:var(--text);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

.hand{display:flex;gap:6px;flex:none;padding-top:4px}
.card{flex:1 1 0;min-width:0;background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:0 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 #0000004d;transition:transform .15s ease,opacity .2s;overflow:hidden;text-align:center;touch-action:none;position:relative}
.card .band{width:100%;height:5px;flex:none}
.card .row{display:flex;align-items:center;gap:2px;margin-top:3px}
.card .ic{font-size:19px;line-height:1}
.shape{display:block;width:34px;height:22px}
.card .body{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.card .nm{font-size:10.5px;font-weight:600;line-height:1.1;hyphens:auto;-webkit-hyphens:auto;min-height:23px;display:flex;align-items:center;padding-inline:3px;overflow-wrap:anywhere}
.card .st{display:flex;gap:3px;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.card .st .a,.ocard .st .a{color:#b86500} .card .st .s,.ocard .st .s{color:#00857a}
.card .hb{font-size:9.5px;font-weight:600;color:#4b5a4f;min-height:12px}
.card .tx{display:none}
.card .meta{display:flex;flex-direction:column;align-items:center;gap:2px}
.cost{position:absolute;top:8px;right:4px;display:flex;gap:1.5px}
.cost i{width:5px;height:5px;border-radius:50%;background:var(--ink);display:block}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 7px 0 #0000004d}
.card.dragging{opacity:.4}
.card.poor{opacity:.42}
.card:disabled{cursor:default}
.dragimg{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);background:var(--paper);border-radius:12px;padding:6px 8px;
  box-shadow:0 10px 24px #000a,0 0 0 3px var(--gold);display:flex;align-items:center;gap:4px;font-size:22px}

.log{background:var(--panel);border-radius:10px;padding:8px 10px;flex-direction:column;gap:4px}
.log h4{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.log svg{display:block;width:100%;height:auto}
.log .lb{fill:var(--gold)} .log .lb.empty{fill:#ffffff12}
.log text{fill:var(--muted);font-size:9px;font-family:var(--f-body);text-anchor:middle}
.log text.v{fill:var(--text);font-weight:600}
.log .grid{stroke:#ffffff1a;stroke-width:1}
.log .past{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.log .past b{color:var(--text);font-weight:600}

.overlay{position:fixed;inset:0;background:#07170ecc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:16px;padding:16px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #000a;animation:pop .3s ease;max-height:100%;overflow:auto}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--gold);text-wrap:balance}
.modal h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.modal p{margin:0}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pile{display:flex;flex-wrap:wrap;gap:5px}
.pile span{background:var(--paper);color:var(--ink);border-radius:7px;padding:2px 7px;font-size:12.5px;font-weight:600;border-left:5px solid}
.pile em{color:var(--muted);font-style:normal;font-size:13px}
.offer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ocard{background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:0 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;overflow:hidden;box-shadow:0 4px 0 #0000004d;min-width:0}
.ocard:hover{transform:translateY(-3px)}
.ocard .band{align-self:stretch;margin-inline:-6px;min-height:22px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;padding:2px}
.ocard .ic{font-size:30px;line-height:1}
.ocard .shape{width:50px;height:30px}
.ocard .nm{font-family:var(--f-display);font-size:15px;line-height:1.1}
.ocard .tx{font-size:11.5px;line-height:1.25;color:#3b4a3f}
.ocard .st{font-size:12px;font-weight:600;display:flex;gap:6px;font-variant-numeric:tabular-nums}
.rar{font-size:10px;font-weight:600;color:#7a5a00}
.bigscore{font-family:var(--f-display);font-size:38px;color:var(--gold);font-variant-numeric:tabular-nums}
.habrow{display:flex;gap:8px;flex-wrap:wrap}
.habrow span{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.habrow i{width:14px;height:14px;border-radius:4px;display:inline-block}

@media (max-width:380px){.cnt span{font-size:19px}.card .nm{font-size:9.5px}.offer{gap:6px}.ocard .tx{font-size:10.5px}.btn{padding-inline:9px;font-size:13px}.season-name{font-size:13px}}

.money{font-weight:600;background:var(--panel2);border-radius:9px;padding:6px 9px;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap;flex:none;font-size:14px}
.money.neg{color:#ffb3b5;background:#5a1f22}
.money.pop{animation:pop .35s ease}
.progs{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow:hidden}
.prog{width:26px;height:26px;border-radius:7px;background:var(--panel2);border:0;font-size:14px;display:grid;place-items:center;color:var(--text);padding:0;flex:none}
.prog.ad{outline:2px dashed var(--gold);outline-offset:-2px}
.prog.empty{opacity:.4;border:1px dashed var(--muted);background:none;cursor:default}
.rl{position:absolute;top:9px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 1.5px var(--paper)}
.dupc{position:absolute;top:17px;right:3px;font-size:9px;font-weight:700;color:#c0392b}
#board .rlmark{fill:var(--bad);stroke:var(--paper);stroke-width:.7;pointer-events:none}
#board .dupm{font-size:4.6px;font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none}
.badge.big{transform:translate(-50%,-118%);display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:2px 7px}
.badge .base{color:#cfd8cc;font-weight:500}
.infobtn{margin-top:2px;align-self:flex-start;border:0;border-radius:8px;padding:4px 10px;background:var(--panel2);color:var(--text);font-size:12.5px;font-weight:600}
.infobtn:disabled{opacity:.45;cursor:default}
ul.fx{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px;line-height:1.3}
ul.fx li{padding-left:0}
ul.fx b{font-weight:700;margin-right:2px;white-space:nowrap}
ul.fx b.b{color:var(--attr)} ul.fx b.n{color:var(--schutz)} ul.fx b.bn{color:var(--gold)} ul.fx b.neg{color:#ff8a8d} ul.fx b.w{color:var(--muted);font-weight:600}
ul.fx li.dim{color:var(--muted)}
.card ul.fx b.b,.ocard ul.fx b.b,.gcard ul.fx b.b,.pcard ul.fx b.b,.item ul.fx b.b{color:#b86500}
.card ul.fx b.n,.ocard ul.fx b.n,.gcard ul.fx b.n,.pcard ul.fx b.n,.item ul.fx b.n{color:#00857a}
.card ul.fx b.bn,.ocard ul.fx b.bn,.gcard ul.fx b.bn,.pcard ul.fx b.bn,.item ul.fx b.bn{color:#8a6a00}
.card ul.fx b.neg,.ocard ul.fx b.neg,.gcard ul.fx b.neg,.pcard ul.fx b.neg,.item ul.fx b.neg{color:#c0392b}
.card ul.fx b.w,.ocard ul.fx b.w,.gcard ul.fx b.w,.pcard ul.fx b.w,.item ul.fx b.w{color:#5d6b60}
.card ul.fx li.dim,.ocard ul.fx li.dim,.gcard ul.fx li.dim,.pcard ul.fx li.dim{color:#7a857c}
.ocard ul.fx{text-align:left;font-size:11.5px}
.info ul.fx{font-size:12.5px}
.brk{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.brk b{color:var(--text);font-weight:600}
.brk .p{color:var(--gold)} .brk .m{color:#ffb3b5}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 3px 0 #0000004d;min-width:0}
.item .kind{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5d6b60}
.item .nm{font-family:var(--f-display);font-size:15px;line-height:1.1}
.item .tx{font-size:12px;line-height:1.25;color:#3b4a3f}
.item .tx2{font-size:11px;color:#5d6b60;font-style:italic}
.item .price{font-weight:600;color:#7a5a00;font-variant-numeric:tabular-nums}
.item:disabled{opacity:.45;cursor:default}
.item.sold{opacity:.35}
.shopbar{display:flex;gap:8px;flex-wrap:wrap}

<script>
document.documentElement.lang='de';
//ENGINE-START
const DAYS=6,HAND=5,BP=4,MAXPROGS=4,MAXLVL=3;
const ROMAN=['','I','II','III'];
const SEASONS=[{name:'Frühling',target:5000},{name:'Sommer',target:35000},{name:'Herbst',target:120000},{name:'Winter',target:260000,winter:true}];
const EARLY_BONUS=5; // Taler je übrigem Tag, wenn das Saisonziel früh erreicht ist
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hk=(q,r)=>q+','+r;
let BOARD=[],ONBOARD=new Set();
function setBoard(cells){BOARD=cells.map(c=>c.slice());ONBOARD=new Set(BOARD.map(([q,r])=>hk(q,r)))}
const hexDisc=(R,cq=0,cr=0)=>{const o=[];for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(Math.abs(q+r)<=R)o.push([q+cq,r+cr]);return o};
setBoard(hexDisc(5));
const SHAPES={
  s1:{cells:[[0,0]],label:'1 Feld'},
  s2:{cells:[[0,0],[1,0]],label:'2 Felder'},
  l3:{cells:[[-1,0],[0,0],[1,0]],label:'3er-Reihe'},
  t3:{cells:[[0,0],[1,0],[0,1]],label:'Dreieck'},
  b3:{cells:[[-1,0],[0,0],[0,1]],label:'Bogen'},
  l4:{cells:[[-1,0],[0,0],[1,0],[2,0]],label:'4er-Reihe'},
  d4:{cells:[[0,0],[1,0],[0,1],[1,1]],label:'Raute'},
  z4:{cells:[[-1,0],[0,0],[0,1],[1,1]],label:'Zickzack'},

function rotCells(cells,rot){let c=cells.map(x=>x.slice());for(let i=0;i<((rot%6)+6)%6;i++)c=c.map(([q,r])=>[-r,q+r]);return c}
function placeCells(key,rot,q,r){return rotCells(SHAPES[CARDS[key].shape].cells,rot).map(([a,b])=>[a+q,b+r])}
const costOf=key=>SHAPES[CARDS[key].shape].cells.length;

const CAT={gehege:{label:'Gehege',col:'var(--c-gehege)'},attr:{label:'Attraktion',col:'var(--c-attr)'},
  essen:{label:'Essen',col:'var(--c-essen)'},schutz:{label:'Naturschutz',col:'var(--c-schutz)'}};
const HAB={wasser:{label:'Wasser',icon:'💧',col:'var(--h-wasser)',terr:'Wasser'},savanne:{label:'Savanne',icon:'🌾',col:'var(--h-savanne)',terr:'Savanne'},
  wald:{label:'Wald',icon:'🌿',col:'var(--h-wald)',terr:'Wald'},wueste:{label:'Wüste',icon:'🏜️',col:'var(--h-wueste)',terr:'Wüste'}};

const has=(n,t)=>(K(n).tags||[]).includes(t);
const isCat=(n,c)=>K(n).cat===c;
const isHab=(n,h)=>K(n).hab===h;
const cnt=(arr,f)=>arr.filter(f).length;
const essenMalus=nb=>-cnt(nb,n=>has(n,'scheu')); // Essensstände stören nur scheue Tiere
const cold=h=>h==='savanne'||h==='wueste';

const CARDS={
  pinguine:{name:'Pinguinbecken',icon:'🐧',cat:'gehege',hab:'wasser',shape:'s1',a:3,s:2,rar:'gewöhnlich',
    text:'',bonus:nb=>({a:2*cnt(nb,n=>n.key==='delfinshow')+(CTX.winter?2:0)})},
  flamingos:{name:'Flamingoteich',icon:'🦩',cat:'gehege',hab:'wasser',shape:'s2',a:2,s:3,rar:'gewöhnlich',

  schildkroeten:{name:'Schildkröten',icon:'🐢',cat:'gehege',hab:'wasser',shape:'s1',a:1,s:3,tags:['bedroht'],rar:'gewöhnlich',text:'Bedrohte Art.'},
  seeloewen:{name:'Seelöwenbucht',icon:'🦭',cat:'gehege',hab:'wasser',shape:'s2',a:5,s:1,rar:'gewöhnlich',
    text:'Show-Talente: +2 Besucher je benachbarter Essensstand.',bonus:nb=>({a:2*cnt(nb,n=>isCat(n,'essen'))})},
  otter:{name:'Otterbach',icon:'🦦',cat:'gehege',hab:'wasser',shape:'l3',a:3,s:3,rar:'gewöhnlich',
    text:'+2 Natur je benachbarte Grünfläche oder Wasserfall.',bonus:nb=>({s:2*cnt(nb,n=>n.key==='gruen'||n.key==='wasserfall')})},
  nilpferde:{name:'Nilpferdsee',icon:'🦛',cat:'gehege',hab:'wasser',shape:'d4',a:6,s:4,tags:['bedroht'],rar:'selten',text:'Großes Gehege. Bedrohte Art.'},
  affen:{name:'Affeninsel',icon:'🐒',cat:'gehege',hab:'wald',shape:'s1',a:4,s:1,rar:'gewöhnlich',

  pandas:{name:'Große Pandas',icon:'🐼',cat:'gehege',hab:'wald',shape:'s2',a:4,s:4,tags:['bedroht'],rar:'selten',text:'Bedrohte Art. Publikumsliebling.'},

  faultiere:{name:'Faultierhaus',icon:'🦥',cat:'gehege',hab:'wald',shape:'s1',a:3,s:2,rar:'gewöhnlich',

  woelfe:{name:'Wolfsrevier',icon:'🐺',cat:'gehege',hab:'wald',shape:'b3',a:4,s:3,rar:'gewöhnlich',
    text:'Rudeltiere: +1 Natur je benachbartes Gehege.',bonus:nb=>({s:cnt(nb,n=>isCat(n,'gehege'))})},
  reptilien:{name:'Reptilienhaus',icon:'🦎',cat:'gehege',hab:'wueste',shape:'s1',a:2,s:3,rar:'gewöhnlich',text:'Ruhige Tiere, solider Artenschutz.'},
  erdmaennchen:{name:'Lama-Gehege',icon:'🦙',cat:'gehege',hab:'wueste',shape:'s1',a:3,s:1,rar:'gewöhnlich',
    text:'Neugierig: +2 Besucher je benachbarter Essensstand oder Streichelzoo.',bonus:nb=>({a:2*cnt(nb,n=>isCat(n,'essen')||n.key==='streichelzoo')})},
  kamele:{name:'Kamelpfad',icon:'🐫',cat:'gehege',hab:'wueste',shape:'l3',a:4,s:2,rar:'gewöhnlich',text:'Großes Gehege, langgezogen.'},

  giraffen:{name:'Giraffenweide',icon:'🦒',cat:'gehege',hab:'savanne',shape:'b3',a:5,s:3,rar:'gewöhnlich',text:'Großes Gehege, gebogen.'},
  zebras:{name:'Zebrasteppe',icon:'🦓',cat:'gehege',hab:'savanne',shape:'t3',a:4,s:3,rar:'gewöhnlich',text:'Großes Gehege, kompakt.'},
  warzenschweine:{name:'Warzenschweine',icon:'🐗',cat:'gehege',hab:'savanne',shape:'s1',a:2,s:2,rar:'gewöhnlich',

  elefanten:{name:'Elefantenpark',icon:'🐘',cat:'gehege',hab:'savanne',shape:'d4',a:6,s:4,tags:['bedroht'],rar:'selten',text:'Großes Gehege. Bedrohte Art.'},
  loewen:{name:'Löwensavanne',icon:'🦁',cat:'gehege',hab:'savanne',shape:'l4',a:8,s:2,rar:'selten',text:'Großes Gehege, sehr lang. Sehr beliebt.'},
  nashoerner:{name:'Nashornsteppe',icon:'🦏',cat:'gehege',hab:'savanne',shape:'z4',a:3,s:7,tags:['bedroht'],rar:'sehr selten',text:'Großes Gehege. Bedrohte Art, starker Artenschutz.'},

  delfinshow:{name:'Delfinshow',icon:'🐬',cat:'attr',shape:'s2',a:6,s:0,rar:'gewöhnlich',
    text:'Laut: −1 Natur je benachbartes Gehege, außer Wasser-Gehegen.',bonus:nb=>({s:-cnt(nb,n=>isCat(n,'gehege')&&!isHab(n,'wasser'))})},

const axXY=(q,r)=>[Math.sqrt(3)*(q+r/2),1.5*r];
function connectedPart(cells){if(!cells.length)return cells;const set=new Set(cells.map(c=>hk(...c)));
  let start=cells.reduce((b,c)=>Math.hypot(...axXY(...c))<Math.hypot(...axXY(...b))?c:b,cells[0]);
  const seen=new Set([hk(...start)]),q=[start];while(q.length){const[a,b]=q.pop();for(const[dq,dr]of DIRS){const k=hk(a+dq,b+dr);if(set.has(k)&&!seen.has(k)){seen.add(k);q.push([a+dq,b+dr])}}}
  return cells.filter(c=>seen.has(hk(...c)))}
// star-shaped outline around the centre: rim(angle) gives the radius
function starShape(rim,lo,hi){let best=null;
  for(let base=3;base<9;base+=.05){const cells=connectedPart(hexDisc(10).filter(([q,r])=>{const[x,y]=axXY(q,r),d=Math.hypot(x,y)/Math.sqrt(3);return d<=base+rim(Math.atan2(y,x))}));
    if(cells.length>=lo&&cells.length<=hi)return cells;if(cells.length>hi)return best||cells;best=cells}return best}
function addPatches(t,set,habs,rnd,minSize=2,maxSize=4){const pick=a=>a[Math.floor(rnd()*a.length)],cells=[...set].map(k=>k.split(',').map(Number));
  const touches=([q,r],own)=>DIRS.some(([dq,dr])=>{const k=hk(q+dq,r+dr);return t.has(k)&&!own.has(k)});
  for(const h of habs){for(let tries=0;tries<80;tries++){const seed=pick(cells);if(t.has(hk(...seed))||touches(seed,new Set()))continue;
    const size=minSize+Math.floor(rnd()*(maxSize-minSize+1)),patch=[seed],own=new Set([hk(...seed)]);
    for(let g=0;g<40&&patch.length<size;g++){const[pq,pr]=pick(patch),[dq,dr]=pick(DIRS),n=[pq+dq,pr+dr],k=hk(...n);
      if(set.has(k)&&!t.has(k)&&!own.has(k)&&!touches(n,own)){patch.push(n);own.add(k)}}
    if(patch.length>=Math.min(2,minSize)){patch.forEach(p=>t.set(hk(...p),h));break}}}}

    const[q,r]=k.split(',').map(Number);if(DIRS.some(([dq,dr])=>t.get(hk(q+dq,r+dr))==='block'))continue;t.set(k,'block');placed++}}
function genMap(key,rnd=Math.random,extra=0){const t=new Map(),pick=a=>a[Math.floor(rnd()*a.length)],habs=Object.keys(HAB);let cells;
  if(key==='flusstal'){cells=[];for(let row=0;row<7;row++)for(let c=0;c<13;c++)cells.push([c-Math.floor(row/2),row]);
    let row=2+Math.floor(rnd()*3);const at=(c,rw)=>hk(c-Math.floor(rw/2),rw);
    for(let c=0;c<13;c++){t.set(at(c,row),'wasser');if(c<12&&rnd()<.55){const nr=Math.max(1,Math.min(5,row+(rnd()<.5?-1:1)));if(nr!==row){t.set(at(c,nr),'wasser');row=nr}}}
    const set=new Set(cells.map(c=>hk(...c)));addPatches(t,set,['savanne','wald','wueste'],rnd);addRocks(t,set,4,rnd)}
  else if(key==='bucht'){const ph=rnd()*Math.PI*2,ph2=rnd()*Math.PI*2;
    cells=starShape(a=>1.25*Math.cos(3*(a-ph))+.35*Math.cos(5*a+ph2),88,95);const set=new Set(cells.map(c=>hk(...c)));
    const edge=cells.filter(([q,r])=>DIRS.some(([dq,dr])=>!set.has(hk(q+dq,r+dr))));
    const angd=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));const ang=c=>{const[x,y]=axXY(...c);return Math.atan2(y,x)};
    const bay=ph+Math.PI/3+2*Math.PI/3*Math.floor(rnd()*3),cape=ph+2*Math.PI/3*Math.floor(rnd()*3);
    edge.filter(c=>angd(ang(c),bay)<.5).slice(0,9).forEach(c=>t.set(hk(...c),'wasser'));
    edge.filter(c=>angd(ang(c),cape)<.35&&!t.has(hk(...c))).slice(0,6).forEach(c=>t.set(hk(...c),'wueste'));
    addPatches(t,set,['savanne','wald'],rnd);addRocks(t,set,4,rnd)}
  else if(key==='huegel'){const flip=rnd()<.5,ca=flip?[-2,-4]:[-4,-2],cb=flip?[2,4]:[4,2],A=hexDisc(3,...ca),B=hexDisc(3,...cb);
    const inAB=new Set([...A,...B].map(c=>hk(...c))),line=[],N=12;
    for(let i=0;i<=N;i++){let fq=ca[0]+(cb[0]-ca[0])*i/N,fr=ca[1]+(cb[1]-ca[1])*i/N,fs=-fq-fr,q=Math.round(fq),r=Math.round(fr),s2=Math.round(fs);
      const dq=Math.abs(q-fq),dr=Math.abs(r-fr),ds=Math.abs(s2-fs);if(dq>dr&&dq>ds)q=-r-s2;else if(dr>ds)r=-q-s2;if(!inAB.has(hk(q,r)))line.push([q,r])}
    const bridge=new Map();line.forEach(([q,r])=>{for(const[dq,dr]of[[0,0],...DIRS]){const c=[q+dq,r+dr];if(!inAB.has(hk(...c)))bridge.set(hk(...c),c)}});

function mkIndex(bs){const m=new Map();for(const b of bs)for(const[q,r]of b.cells)m.set(hk(q,r),b);return m}
function nbrs(b,idx){const s=new Set();for(const[q,r]of b.cells)for(const[dq,dr]of DIRS){const o=idx.get(hk(q+dq,r+dr));if(o&&o!==b)s.add(o)}return[...s]}

function evalB(b,bs,idx,parts){const c=CARDS[b.key],nb=nbrs(b,idx);let a=c.a,s=c.s;
  const add=(label,da,ds)=>{da=da||0;ds=ds||0;if(!da&&!ds)return;a+=da;s+=ds;if(parts)parts.push({label,a:da,s:ds})};
  const lv=b.lvl||1;if(lv>1){const u=(lv-1)*upStep(b);add(`Ausbau Stufe ${ROMAN[lv]}`,u,u)}
  if(c.hab){add(`${HAB[c.hab].label}-Nachbarn`,cnt(nb,n=>isCat(n,'gehege')&&isHab(n,c.hab)),0);add(`${HAB[c.hab].label}-Naturfläche`,0,natCells(b.cells,c.hab));
    if(CTX.winter&&cold(c.hab))add('Winterkälte',-1,0)}
  if(c.bonus){const r=c.bonus(nb,bs,b);add('Kartenbonus',r.a,r.s)}
  if(c.tags.includes('beute')){const p=cnt(nb,n=>has(n,'raubtier'))*(hasEv('ausbruch')?2:1);add('Raubtier nebenan',-p,-p)}
  for(const id of CTX.progs){const e=PROGS[id].per&&PROGS[id].per(b,c,nb);if(e)add(PROGS[id].name,e.a,e.s)}
  for(const id of CTX.ads){const e=ADS[id].per&&ADS[id].per(b,c,nb);if(e)add(ADS[id].name,e.a,e.s)}
  for(const ev of CTX.ev||[]){const E=EVENTS[ev.id],e=E&&E.per&&E.per(b,c,ev.k||1);if(e)add(E.name,e.a,e.s)}

    if(c.mult){const m=c.mult(v.nb,bs);if(m)mults.push({id:b.id,label:c.name,...m})}}
  for(const id of CTX.progs){const m=PROGS[id].mult&&PROGS[id].mult(bs);if(m)mults.push({id:null,label:PROGS[id].name,icon:PROGS[id].icon,...m})}
  for(const id of CTX.ads){const m=ADS[id].mult&&ADS[id].mult(bs);if(m)mults.push({id:null,label:ADS[id].name,icon:ADS[id].icon,...m})}
  let A2=A,S2=S;for(const m of mults){if(m.ma)A2*=m.ma;if(m.ms)S2*=m.ms}

function genShopItems(){const pick=a=>a.length?a.splice(Math.floor(Math.random()*a.length),1)[0]:null;

  const out=[];for(const[kind,arr]of[['prog',progs],['prog',progs],['ad',ads],['card',cards]]){const k=pick(arr);if(k)out.push(mkItem(kind,k))}return out}

/* ---------- modals ---------- */
function offerCard(k,i){const c=CARDS[k],d=cnt(state.buildings,b=>b.key===k);return`<button class="ocard" data-pick="${i}">
  <span class="band" style="background:${colOf(c)}">${c.hab?habBadge(c.hab)+' '+HAB[c.hab].label:CAT[c.cat].label} · ${costOf(k)} BP</span>
  <span class="ic">${c.icon}</span>${miniShape(k)}<span class="nm">${c.name}</span><span class="st"><span class="a">${c.a} B</span><span class="s">${c.s} N</span></span>
  <span class="tx">${fxHtml(c)}</span>${perkN(k)?`<span class="rar">🏅 ${perkN(k)}× verbessert</span>`:''}${c.tags.includes('einmalig')?'<span class="rar">Einmalig im Zoo</span>':''}${c.tags.includes('bedroht')?'<span class="rar" style="color:#c0392b">● Rote Liste</span>':''}${d?`<span class="rar" style="color:#c0392b">schon ${d}× gebaut</span>`:''}${c.rar!=='gewöhnlich'?`<span class="rar">${rarLabel(c)}</span>`:''}</button>`}
function pileHtml(keys){if(!keys.length)return'<em>leer</em>';const m={};keys.forEach(k=>m[k]=(m[k]||0)+1);
  return Object.keys(m).sort((a,b)=>CARDS[a].name.localeCompare(CARDS[b].name,'de')).map(k=>`<span style="border-left-color:${colOf(CARDS[k])}">${CARDS[k].icon} ${CARDS[k].name}${m[k]>1?' ×'+m[k]:''}</span>`).join('')}
let helpOpen=false;
function helpHtml(){return`<h2>Menü</h2><button class="btn main big" id="mClose">▶ Weiterspielen</button>
  <div class="menubtns"><button class="btn sub" id="mHome">🏠 Hauptmenü</button><button class="btn sub" id="mTut">📖 Tutorial</button><button class="btn sub" id="mRestart">${state&&state.mode==='camp'?'🏳 Lauf beenden':'⟲ Neues Spiel'}</button></div>
  <div class="setrow"><span>Auszähl-Tempo:</span>${[[0,'Normal'],[1,'Schnell']].map(([v,l])=>`<button class="chip2 ${SCFAST===v?'on':''}" data-scf="${v}">${l}</button>`).join('')}</div>
  <div class="setrow"><span>Schiebe-Tempo im Zoom:</span>${[[1.5,'Normal'],[2.25,'Schnell'],[3,'Sehr schnell']].map(([v,l])=>`<button class="chip2 ${PANSPEED===v?'on':''}" data-pan="${v}">${l}</button>`).join('')}</div>
  <button class="btn sub" id="mRules">${helpOpen?'▾ Spielregeln ausblenden':'▸ 📜 Spielregeln anzeigen'}</button>
  ${helpOpen?`<ul>
  <li>Jeden Morgen ziehst du 5 Karten aus deinem Deck und hast <b>4 Baupunkte</b>. Jedes Feld einer Karte kostet 1 Baupunkt.</li>
  <li>Karte aufs Gelände ziehen oder antippen und aufs Feld tippen, mit <b>↻ Drehen</b> ausrichten, dann <b>Bauen</b>. Du kannst mehrere Karten pro Tag bauen.</li>
  <li><b>Tag beenden:</b> Übrige Handkarten kommen auf die Ablage, dann zählt der ganze Zoo: <b>Summe Besucher × Summe Natur</b>.</li>
  <li>Gebaute Karten sind <b>verbraucht</b>. Für jede gebaute Karte wählst du nach dem Tag 1 von 3 neuen Karten.</li>
  <li><b>Wiederholung:</b> Die zweite Anlage derselben Art bringt nur 75 % ihrer Besucher und Natur (samt Boni), die dritte 50 %, jede weitere 25 %. Besucher wollen Abwechslung.</li>
  <li><b>Jahreszeiten-Karten:</b> Manche Karten wirken je nach Jahreszeit stärker oder schwächer, das steht auf der Karte. Blumenschau, Wasserspielplatz, Kürbisfest und die Winter-Karten gibt es nur in ihrer Jahreszeit zur Auswahl.</li>
  <li><b>Meilensteine:</b> Ab 5 Gehegen eines Lebensraums oder 6 Attraktionen, Essensständen oder Naturschutz-Gebäuden bekommst du am nächsten Morgen eine besondere Karte auf die Hand. Der Fortschritt steht im Deck-Fenster.</li>
  <li><b>Raubtiere und Beute:</b> Beutetiere (Zebras, Giraffen, Warzenschweine, Lamas, Flamingos, Kamele) bekommen −1 B und −1 N je benachbartes Raubtier (Löwen, Tiger, Geparden, Wölfe). Essensstände verlieren 1 N neben <b>scheuen</b> Tieren (Pandas, Faultiere, Schildkröten, Nashörner, Fenneks).</li>
  <li><b>Pause:</b> Nach jeder Auszählung kannst du dir den Zoo in Ruhe anschauen. Weiter geht es mit „Nächsten Tag starten“.</li>
  <li><b>Lebensraum:</b> +1 Besucher je benachbartes Gehege mit gleichem Lebensraum. Auf <b>Naturflächen</b> dürfen nur passende Gehege (mit +1 Natur je Feld), andere Gehege nicht. Alle anderen Gebäude dürfen dort ohne Bonus stehen.</li>
  <li><b>Umziehen:</b> Gebautes antippen, dann wird der mittlere Knopf zu „🚚 Umziehen“. Neuen Platz wählen und mit „Setzen“ bestätigen. Kostet 1 Baupunkt, die Ausbaustufe bleibt. ↶ bricht vorher ab.</li>
  <li><b>Ausbauen:</b> Ziehe eine Gehege-Karte auf ein gleiches Gehege. Gleiche Kosten, +1 B und +1 N je angefangene 2 Felder pro Stufe, bis Stufe III. Zählt nicht als Wiederholung.</li>
  <li><b>Bonus-Karten:</b> Schaffst du alle vier Jahreszeiten, schaltest du 1 von 3 Bonus-Karten für deinen Speicherplatz frei.</li>
  <li><b>Speicherplätze und Verbesserungen:</b> Jeder der drei Speicherplätze hat seinen eigenen Zoo. Nach jedem beendeten Spiel verbesserst du eine Karte dauerhaft um +1 B oder +1 N (🏅, bis zu 3-mal pro Karte).</li>
  <li><b>🔍 Zoom</b> sitzt in einer freien Ecke des Geländes oder oben in der Leiste. Auf freier Fläche ziehen verschiebt den Ausschnitt. Beim Tagesende geht der Zoom aus.</li>
  <li><b>Ereignisse:</b> Ab dem Sommer gilt jede Jahreszeit ein zufälliges Ereignis (Symbol oben neben „Saison“, antippen zeigt die Wirkung). Im Shop siehst du schon vorher, was kommt.</li>
  <li><b>Kampagne:</b> Zoo um Zoo wird es schwerer. Du startest mit deinem Kampagnen-Deck, das du nach jedem Lauf dauerhaft verbesserst (1 Karte plus 1 je geschafftem Zoo). Das Deck für das freie Spiel ist davon getrennt. Nach jedem geschafften Jahr gibt es 3 Kartenverbesserungen, 1 neue Karte und 1 Lauf-Bonus, die nur für diesen Lauf gelten. Deck und Boni nimmst du mit, Zoo, Taler und Förderprogramme nicht.</li>
  <li><b>🔄 Neu ziehen:</b> Für 1 Baupunkt wirfst du die ganze Hand ab und ziehst fünf neue Karten. Zweimal tippen zum Bestätigen. Das lässt sich nicht rückgängig machen, und die Züge davor sind danach fest.</li>
  <li><b>↶ Rückgängig</b> nimmt Bauen, Ausbauen und Umziehen des heutigen Tages Schritt für Schritt zurück.</li>
  <li><b>Einmalig:</b> Gebäude mit Bonus für den ganzen Zoo (Forschungslabor, Artenvielfalt-Institut, Zoo-Stiftung, Nachtführung) gibt es nur einmal im Zoo.</li>
  <li><b>Rote Liste</b> (roter Punkt): bedrohte Arten. Tierarzt, Zuchtstation und manche Förderprogramme belohnen sie.</li>
  <li><b>Saisonende:</b> Sobald das Ziel erreicht ist, endet die Saison. Jeder übrige Tag bringt +5 Taler.</li>
  <li><b>Geld:</b> Jeder Tag bringt 1 Taler je 6 Besucher und kostet 1 Taler je 8 Natur. Zinsen: +1 je 10 Taler (max. 5), bei Schulden −1 je 10.</li>
  <li><b>Shop</b> nach jeder Saison (Preise steigen jede Saison um 50 %): Förderprogramme (dauerhaft, 4 Plätze), Werbung (nächste Saison), seltene Karten, Karte entfernen, +1 Baupunkt. Mit Schulden kannst du nichts kaufen.</li>
  <li><b>Winter:</b> Savannen- und Wüstengehege frieren (−1 B).</li></ul>
  <div class="habrow">${Object.values(HAB).map(h=>`<span><i style="background:${h.col}"></i>${h.icon} ${h.label}</span>`).join('')}</div>
  <div class="habrow">${['attr','essen','schutz'].map(k=>`<span><i style="background:var(--paper);border:3px solid ${CAT[k].col}"></i>${CAT[k].label}</span>`).join('')}</div>`:''}`}
function renderModal(){const root=$('modalRoot'),se=state?seOf(state.season):null,inGame=!!state&&!screen;let h='',wide=false;
  if(modal==='help')h=helpHtml();
  else if(modal==='maps'){h=mapsHtml();wide=true}
  else if(modal==='tut'){const sl=tutSlides(),i=Math.max(0,Math.min(tutIdx,sl.length-1)),S=sl[i];
    h=`<div class="tut"><div class="tuthead"><span>Tutorial · ${i+1} / ${sl.length}</span><button class="icbtn" id="mClose" aria-label="Tutorial schließen">✕</button></div>${S.svg}<h2>${S.title}</h2><p>${S.text}</p>
      <div class="dotsnav">${sl.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
      <div class="shopbar"><button class="btn sub" id="tPrev" ${i?'':'disabled'}>‹ Zurück</button><button class="btn main" id="tNext">${i<sl.length-1?'Weiter ›':'Los geht’s'}</button></div></div>`}
  else if(modal==='restart')h=state.mode==='camp'?`<h2>Lauf beenden?</h2><p>Der Kampagnen-Lauf endet hier und kommt mit ${state.zoo} geschafften Zoo${state.zoo===1?'':'s'} in die Bestenliste.</p><div class="shopbar"><button class="btn sub" id="mClose">Abbrechen</button><button class="btn main" id="mRestartYes">Ja, Lauf beenden</button></div>`
    :`<h2>Neues Spiel starten?</h2><p>Dein aktueller Zoo, dein Deck und deine Kasse gehen verloren.</p><div class="shopbar"><button class="btn sub" id="mClose">Abbrechen</button><button class="btn main" id="mRestartYes">Ja, neu starten</button></div>`;
  else if(modal==='deck')h=`<h2>Dein Deck</h2><h3>Nachziehstapel · ${state.deck.length}</h3><div class="pile">${pileHtml(state.deck)}</div>
    <h3>Ablagestapel · ${state.discard.length}</h3><div class="pile">${pileHtml(state.discard)}</div>
    <h3>Hand · ${state.hand.length}</h3><div class="pile">${pileHtml(state.hand)}</div>${Object.keys(state.boni||{}).length?`<h3>Lauf-Boni</h3><div class="pile">${Object.keys(state.boni).filter(id=>RUNB[id]).map(id=>`<span>${RUNB[id].icon} ${RUNB[id].name}${state.boni[id]>1?' ×'+state.boni[id]:''}: ${RUNB[id].fx[0].replace('|',' ')}</span>`).join('')}</div>`:''}<h3>Meilensteine</h3><div class="mile">${Object.keys(MILE).map(t=>{const M=MILE[t],n=Math.min(M.n,mileCount(state.buildings,t)),ok=(state.miles||{})[t];return`<span class="${ok?'ok':''}">${M.icon} ${ok?'✓ '+CARDS[M.card].name:n+'/'+M.n}</span>`}).join('')}</div><button class="btn main" id="mClose">Schließen</button>`;
  else if(inGame&&state.phase==='draft')h=`<h2>Neue Karte ${state.pickTotal-state.picks+1} von ${state.pickTotal}</h2><p>Du hast ${state.pickTotal} Karte${state.pickTotal>1?'n':''} verbaut und darfst genauso viele neue wählen. Sie kommen auf deine Ablage.</p>${state.pendingSeason&&seOf(state.season+1)?evLine(state.eventsNext,'im '+seOf(state.season+1).name):''}<div class="offer">${state.offer.map(offerCard).join('')}</div><div class="shopbar"><button class="btn sub" id="mDraftRoll" ${canPay(draftPrice())?'':'disabled'}>🎲 Neue Auswahl · 🪙 ${draftPrice()}</button><button class="btn sub" data-skip="1">Diese auslassen</button></div><p style="margin:0;font-size:12.5px;color:var(--muted)">In der Kasse: 🪙 ${fmt(state.money)}. Jeder Wurf heute kostet 2 mehr.</p>`;
  else if(inGame&&state.phase==='shop'){h=shopHtml();wide=true}
  else if(inGame&&state.phase==='seasonWon'){const nx=seOf(state.season+1);
    h=`<h2>${se.name} geschafft${state.day<DAYS-1?` an Tag ${state.day+1}`:''}!</h2><div class="bigscore">${fmt(state.seasonScore)}</div><p>Ziel war ${fmt(se.target)}.${state.earlyBonus?` Früh fertig: <b>+🪙 ${state.earlyBonus}</b> für ${state.earlyBonus/EARLY_BONUS} übrige Tag${state.earlyBonus/EARLY_BONUS>1?'e':''}.`:''} In der Kasse: 🪙 ${fmt(state.money)}. Nach deinen neuen Karten geht es in den Shop. Im ${nx.name} brauchst du <b>${fmt(nx.target)}</b> Punkte.</p>${evLine(state.eventsNext,'im '+nx.name)}<button class="btn main" id="mNext">Weiter</button>`}
  else if(inGame&&state.phase==='lost')h=`<h2>Saisonziel verfehlt</h2><div class="bigscore">${fmt(state.seasonScore)} / ${fmt(se.target)}</div><p>Der ${se.name} war zu ruhig. Gesamtpunkte: <b>${fmt(state.totalScore)}</b>. ${state.mode==='camp'?`Dein Lauf endet in Zoo ${state.zoo+1} und kommt in die Kampagnen-Bestenliste. Danach verbesserst du dein Kampagnen-Deck um ${1+state.zoo} Karte${state.zoo?'n':''}.`:'Dein Ergebnis kommt in die Highscore-Liste, und du darfst eine Karte dauerhaft verbessern.'}</p><button class="btn main" id="mFinish">Weiter zur Zusammenfassung</button>`;
  else if(inGame&&state.phase==='win')h=state.mode==='camp'?`<h2>Zoo ${state.zoo+1} geschafft!</h2><div class="bigscore">${fmt(state.totalScore)}</div><p>Alle vier Jahreszeiten geschafft. Jetzt wählst du deine Belohnungen für den Lauf: 3 Kartenverbesserungen, 1 neue Karte und 1 Lauf-Bonus.</p><button class="btn main" id="mFinish">Weiter zur Belohnung</button>`
    :`<h2>Dein Zoo hat das Jahr geschafft!</h2><div class="bigscore">${fmt(state.totalScore)}</div><p>Alle vier Jahreszeiten geschafft. Dein Ergebnis kommt in die Highscore-Liste, und du darfst eine Karte dauerhaft verbessern.</p><button class="btn main" id="mFinish">Weiter zur Zusammenfassung</button>`;
  root.innerHTML=h?`<div class="overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${h}</div></div>`:'';
  root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(+b.dataset.pick));
  root.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>pick(null));
  root.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{const v=b.dataset.item,i=+v.slice(1);buy(v[0]==='f'?fixedItems()[i]:state.shop.items[i])});
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const[p,k]=b.dataset.rm.split('|');removeCard(p,k)});
  const dr=$('mDraftRoll');if(dr)dr.onclick=draftRoll;
  const bk=$('mBack');if(bk)bk.onclick=()=>{state.shopSub=null;render()};
  const rr=$('mReroll');if(rr)rr.onclick=()=>{const p=rerollPrice();if(!canPay(p)){Sfx.deny();return}state.money-=p;state.stats.spent+=p;state.shop.rerolls++;state.shop.items=genShopItems();state.shop.note=null;Sfx.draw();render()};
  const lv=$('mLeave');if(lv)lv.onclick=beginNextSeason;
  const mr=$('mRules');if(mr)mr.onclick=()=>{helpOpen=!helpOpen;Sfx.select();renderModal()};
  const cl=$('mClose');if(cl)cl.onclick=()=>{modal=null;renderAll()};
  const rs=$('mRestart');if(rs)rs.onclick=()=>{modal='restart';render()};

function loadMeta(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const m=JSON.parse(raw);if(m&&Array.isArray(m.slots)&&m.slots.length===3)META=Object.assign({scores:[],cscores:[]},m)}}catch(e){}}

    state.progs=state.progs.filter(id=>PROGS[id]);state.ads=state.ads.filter(id=>ADS[id]);state.adsNext=state.adsNext.filter(id=>ADS[id]);

function enterSlot(i,fresh){META.active=i;META.lastSlot=i;META.lastMode='free';const sl=META.slots[i];applySlot(sl);sl.last=Date.now();

const RUNPERK=5; // dauerhafte + Lauf-Verbesserungen zusammen
function mergePerks(a,b){const o={};for(const p of[a||{},b||{}])for(const k in p){const q=o[k]=o[k]||{};q.a=(q.a||0)+(p[k].a||0);q.s=(q.s||0)+(p[k].s||0)}return o}

function enterCamp(i,fresh){META.active=i;META.lastSlot=i;META.lastMode='camp';const sl=META.slots[i];sl.last=Date.now();
  if(fresh||!sl.run)sl.run={zoo:0,perks:{},cards:[],boni:{},deck:START_DECK.slice(),stats:newStats(),total:0,game:null,reward:null};
  const run=sl.run;applyRun(run);

function startZoo(){const sl=activeSlot(),run=sl.run,cf=campCfg(run.zoo),ev0=run.reward&&run.reward.ev;run.reward=null;applyRun(run);modal=null;
  newGame(cf.map,genMap(cf.map,Math.random,cf.rocks),{deck:run.deck,events:ev0,state:{mode:'camp',zoo:run.zoo,tmult:cf.mult,boni:Object.assign({},run.boni),stats:run.stats||newStats()}});saveMeta();renderAll()}
function tallyZoo(){const t=state.stats;for(const b of state.buildings){t.tally[b.key]=(t.tally[b.key]||0)+1;t.lvl=Math.max(t.lvl||1,b.lvl||1)}}
function summaryOf(st,info){const habs={},cats={attr:0,essen:0,schutz:0};for(const h in HAB)habs[h]=0;

    META.slots[i]={name:v,created:Date.now(),last:Date.now(),game:null,perks:{},games:0};META.lastSlot=i;saveMeta();sc('mode',{slot:i});return}
  if(d.f){screenArg.f=d.f;Sfx.select();renderScreen();return}
  if(d.tab){screenArg.tab=d.tab;screenArg.gf='all';Sfx.select();renderScreen();return}
  if(d.gm){const sl=META.slots[META.lastSlot];screenArg.gm=d.gm;if(sl){if(d.gm==='camp'){applyPerks(sl.cperks||{});UNLOCK=new Set()}else applySlot(sl)}Sfx.select();renderScreen();return}
  if(d.gf){screenArg.gf=d.gf;Sfx.select();renderScreen();return}
  if(d.unlock){const sl=activeSlot();if(!sl)return;sl.unlocked=sl.unlocked||[];if(!sl.unlocked.includes(d.unlock))sl.unlocked.push(d.unlock);applySlot(sl);saveMeta();Sfx.win();Sfx.sparkle();sc('perk',{step:'cat',hl:screenArg.hl,got:d.unlock});return}
  if(d.pcat){const pool=shuffle(perkable(d.pcat)).slice(0,5);screenArg.step='pick';screenArg.cards=pool;Sfx.draw();renderScreen();return}
  if(d.back2){screenArg.step='cat';Sfx.select();renderScreen();return}
  if(d.skipperk){sc('scores',{hl:screenArg.hl});return}
  if(d.cscores){sc('scores',{f:'camp',hl:screenArg.hl,back:'title'});return}
  if(d.perk){const[k,w]=d.perk.split('|'),sl=activeSlot();if(!sl)return;const camp=screenArg.camp,T=camp?(sl.cperks=sl.cperks||{}):(sl.perks=sl.perks||{});const q=T[k]=T[k]||{};if(perkN(k)>=MAXPERK)return;q[w]=(q[w]||0)+1;applyPerks(T);saveMeta();Sfx.win();Sfx.sparkle();
    if(camp&&--screenArg.left>0){screenArg.step='cat';screenArg.last=k;screenArg.cards=null}else{screenArg.step='done';screenArg.key=k;screenArg.w=w}renderScreen();return}
  if(t.id==='sTut'){tutIdx=0;modal='tut';Sfx.select();renderModal();return}
  if(t.id==='sMute'){Sfx.muted=!Sfx.muted;try{localStorage.setItem('zoodeck-muted',Sfx.muted?'1':'0')}catch(e){}renderScreen();return}});
// Übergang in openMaps/chooseMap: Spiel landet im aktiven Speicherplatz
function start(data){loadMeta();if(data&&data.meta&&Array.isArray(data.meta.slots))META=data.meta;
  if(data&&data.state&&!META.slots.some(Boolean)){META.slots[0]={name:'Mein Zoo',created:Date.now(),last:Date.now(),game:data.state,perks:{},games:0};META.lastSlot=0}
  if(data&&data.resume!=null&&META.slots[data.resume]&&data.resumeMode==='camp'&&META.slots[data.resume].run){enterCamp(data.resume);return}
  if(data&&data.resume!=null&&META.slots[data.resume]&&META.slots[data.resume].game){enterSlot(data.resume);return}
  screen='title';renderAll()}
window.claude?.hot?.snapshot?.(()=>{try{saveMeta()}catch(e){}return{meta:JSON.parse(JSON.stringify(META)),resume:screen?null:META.active,resumeMode:state?state.mode:null}});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
