<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12301f">
<meta name="description" content="Zoolatro: Baue deinen Zoo, Karte für Karte.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoolatro">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{margin:0}body{font:14px system-ui,sans-serif;-webkit-touch-callout:none;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zoolatro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: one screen, no scrolling. Phone: stacked column (bar, counters, info, park, actions, hand). Wide screens: park left, controls + full cards + day log right. Single committed dark "jungle at dusk" look. */
:root{
  --bg:#12301f; --panel:#1a3f2a; --panel2:#224d33;
  --tile:#3b7447; --tile2:#427d4e; --tile3:#356b40; --path:#c9b688; --rock:#1c201b; --rock-line:#ffffff24;
  --paper:#f4efe1; --ink:#1d2a21;
  --text:#eaf2e3; --muted:#9fbba5;
  --attr:#ff9f1c; --schutz:#2ec4b6; --bad:#ff5a5f; --gold:#ffd166;
  --c-gehege:#86c96f; --c-attr:#ff7a98; --c-essen:#ffcf4a; --c-schutz:#b49af0; --c-verst:#ffa94d;
  --h-wasser:#5cbfe3; --h-savanne:#e2c46e; --h-wald:#7cc860; --h-wueste:#e8a070;--h-arktis:#cfeaf5;--h-gebirge:#a9a39b;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.3;
  background-image:radial-gradient(circle at 20% 0%,#1d4a31 0,transparent 55%),radial-gradient(circle at 100% 100%,#0d2518 0,transparent 60%);
  -webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;gap:6px}
.side{display:contents}
.top{order:1}.goal{order:2}.counters{order:3}.infowrap{order:4}.boardarea{order:5}.actions{order:6}.handbar{order:7}.hand{order:8}.log{display:none}

.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.5px;color:var(--gold);line-height:1}
.season{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.season-name{font-family:var(--f-display);font-size:15px;white-space:nowrap}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--gold);border-color:var(--gold)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 3px #ffd16633}
.icbtn{border:0;background:var(--panel2);color:var(--text);width:32px;height:32px;border-radius:9px;font-size:15px;font-weight:600;flex:none}

.goal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.goal b{color:var(--text);font-weight:600}
.bar{flex:1;height:8px;border-radius:6px;background:#0c2216;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffb347);border-radius:6px;transition:width .5s ease}
.bar.full i{background:linear-gradient(90deg,#7ee081,var(--gold))}

.counters{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;align-items:center;gap:5px}
.cnt{border-radius:10px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.cnt label{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt span{font-family:var(--f-display);font-size:23px;line-height:1.05;display:block}
.cnt small{display:block;font-size:10px;min-height:12px;line-height:1.2;opacity:.9}
.cnt.a{background:var(--attr);color:#3a1d00}
.cnt.s{background:var(--schutz);color:#00302b}
.cnt.t{background:var(--panel2);border:2px solid #ffffff1a}
.cnt.t span{color:var(--gold)}
.op{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.cnt.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.14)}}

.infowrap{position:relative;height:66px;flex:none;z-index:6}
.info{position:absolute;left:0;right:0;top:0;background:var(--panel);border-radius:10px;padding:6px 10px;min-height:66px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 20px #0007}
.info h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.15}
.info p{margin:0;font-size:12.5px}
.info .hint{color:var(--muted)}
.tag{font-family:var(--f-body);font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;color:var(--ink);letter-spacing:.02em}
.vals{display:flex;gap:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.chip.a{background:#ff9f1c33;color:var(--attr)} .chip.s{background:#2ec4b633;color:var(--schutz)} .chip.n{background:#ffffff14;color:var(--muted)}
.chip.bad{background:#ff5a5f33;color:#ffb3b5}

.boardarea{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.boardwrap{position:relative;aspect-ratio:var(--ar,1);width:min(100cqw,calc(100cqh * var(--ar,1)))}
.boardwrap.zoomed{overflow:hidden;border-radius:12px;box-shadow:inset 0 0 0 2px #ffd16655}
.boardwrap.zoomed #board{cursor:grab}
.zoombtn{position:absolute;bottom:4px;left:4px;z-index:7;width:34px;height:34px;border-radius:50%;border:0;background:#0f2518d9;color:var(--text);font-size:16px;box-shadow:0 2px 8px #0006}
.zoomed .zoombtn{background:var(--gold)}
.minimap{position:absolute;right:6px;bottom:6px;width:72px;height:auto;z-index:7;background:#0f2518d9;border-radius:8px;padding:3px;display:none;pointer-events:none}
.zoomed .minimap{display:none}
.minimap .mc{fill:var(--tile)} .minimap .mc.block{fill:var(--rock)} .minimap .mv{fill:#ffd16622;stroke:var(--gold);stroke-width:4}
#board{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent}
#board .base{fill:var(--path)}
body.nb #board .base{fill:#2b5a2e}body.nb.winter #board .base{fill:#5f7f76}body.nb.sea2 #board .base{fill:#4a5530}
#board .bshd,#board .bsh{display:none;pointer-events:none}body.nb #board .bshd{display:inline;fill:#00000059}body.nb #board .bsh{display:inline;fill:#00000047}body.nb #board .fence{stroke-width:.9;stroke-linejoin:round}
body.nb #board .cell{stroke:#ffffff10;stroke-width:.25}
body.nb .bld .fence{stroke:#00000040;stroke-width:.5}
body.nb .cat-attr .hx{fill:color-mix(in srgb,var(--c-attr) 55%,#fff);stroke:color-mix(in srgb,var(--c-attr) 55%,#fff)}
body.nb .cat-essen .hx{fill:color-mix(in srgb,var(--c-essen) 55%,#fff);stroke:color-mix(in srgb,var(--c-essen) 55%,#fff)}
body.nb .cat-schutz .hx{fill:color-mix(in srgb,var(--c-schutz) 55%,#fff);stroke:color-mix(in srgb,var(--c-schutz) 55%,#fff)}
body.nb .cat-verst .hx{fill:color-mix(in srgb,var(--c-verst) 55%,#fff);stroke:color-mix(in srgb,var(--c-verst) 55%,#fff)}
#board .icbg{fill:#fff;opacity:.55;pointer-events:none}
#board .cell{fill:var(--tile);cursor:pointer;transition:fill .15s}
#board .cell.t1{fill:var(--tile2)} #board .cell.t2{fill:var(--tile3)}
#board .cell:hover{fill:#4d8f5a}
#board .terr{cursor:pointer}
#board .terr.wasser{fill:var(--h-wasser)} #board .terr.savanne{fill:var(--h-savanne)} #board .terr.wald{fill:var(--h-wald)} #board .terr.wueste{fill:var(--h-wueste)} #board .terr.arktis{fill:var(--h-arktis)} #board .terr.gebirge{fill:var(--h-gebirge)}
#board .block{fill:var(--rock)} #board .hatch{fill:url(#hatch)} #board .hatch line{stroke:var(--rock-line);stroke-width:1.1}

#board .tic{font-size:6px;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:.8}
#board .tic.blk{font-size:11px;opacity:.9}
#board .bld{cursor:pointer;transform-box:fill-box;transform-origin:center}
.hx{stroke-width:.8}
.fence{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
#board .ic{font-size:9px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
#board .ic.big{font-size:12px}
#board .natdot{fill:#ffffffaa;pointer-events:none}
.hab-wasser .hx{fill:var(--h-wasser);stroke:var(--h-wasser)} .hab-savanne .hx{fill:var(--h-savanne);stroke:var(--h-savanne)}
.hab-wald .hx{fill:var(--h-wald);stroke:var(--h-wald)} .hab-wueste .hx{fill:var(--h-wueste);stroke:var(--h-wueste)} .hab-arktis .hx{fill:var(--h-arktis);stroke:var(--h-arktis)} .hab-gebirge .hx{fill:var(--h-gebirge);stroke:var(--h-gebirge)}
.cat-attr .hx,.cat-essen .hx,.cat-schutz .hx{fill:var(--paper);stroke:var(--paper)}
.cat-attr .fence{stroke:var(--c-attr);stroke-width:2.2} .cat-essen .fence{stroke:var(--c-essen);stroke-width:2.2} .cat-schutz .fence{stroke:var(--c-schutz);stroke-width:2.2} .cat-verst .fence{stroke:var(--c-verst);stroke-width:2.2;stroke-dasharray:2 1.2}
#board .bld.pulse{animation:pulse .32s ease}
@keyframes pulse{40%{transform:scale(1.08)}}
#board .bld.sel .fence,#board .bld.hl .fence{stroke:var(--gold);stroke-width:2.2}
#board .bld.hlneg .fence{stroke:var(--bad);stroke-width:2.2}
#board .ghost{cursor:pointer;animation:bob 1.2s ease-in-out infinite}
#board .ghost .hx{opacity:.85}
#board .ghost .fence{stroke-dasharray:2 1.5}
#board .ghost.bad .hx{fill:var(--bad);stroke:var(--bad)}
@keyframes bob{50%{transform:translateY(-1.5px)}}
#board .link{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:3 2;fill:none;stroke-linecap:round;animation:dash .8s linear infinite;pointer-events:none}
#board .link.neg{stroke:var(--bad)}
#board .link.flash{animation:dash .8s linear infinite,fadeout .9s ease forwards}
#board .ldot{fill:var(--gold);pointer-events:none} #board .ldot.neg{fill:var(--bad)}
@keyframes dash{to{stroke-dashoffset:-10}}
@keyframes fadeout{0%,60%{opacity:1}to{opacity:0}}

.fxh{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:17px;z-index:5;
  text-shadow:0 2px 0 #0009;animation:rise .95s ease-out forwards;white-space:nowrap}
.float.a{color:var(--attr)} .float.s{color:var(--schutz);margin-top:17px} .float.neg{color:var(--bad)} .float.m{color:var(--gold);font-size:21px}
@keyframes rise{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,calc(-50% - 32px))}}
.badge{position:absolute;transform:translate(-50%,-135%);background:var(--ink);border:2px solid var(--gold);border-radius:8px;
  padding:1px 5px;font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px #0007;z-index:4}
.badge.neg{border-color:var(--bad)}
.badge.flash{animation:fadeout 1s ease forwards}
.badge .a{color:var(--attr)} .badge .s{color:var(--schutz)} .badge .n{color:#ffb3b5}
.skiphint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}

.actions{display:flex;gap:7px;flex:none}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.main{background:var(--gold);color:#3a2a00;flex:1;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.3px}
.btn.sub{background:var(--panel2);color:var(--text)}
.btn.go{background:#7ee081;color:#0e2e14}
.btn:disabled{opacity:.4;cursor:default}

.handbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;font-size:12px;color:var(--muted);font-weight:600}
.bp{display:flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:uppercase}
.bp i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);margin-left:2px}
.bp i.on{background:var(--gold)}
.deckbtn{border:0;background:var(--panel2);color:var(--text);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

.hand{display:flex;gap:6px;flex:none;padding-top:4px}
.card{flex:1 1 0;min-width:0;background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:0 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 4px 0 #0000004d;transition:transform .15s ease,opacity .2s;overflow:hidden;text-align:center;touch-action:none;position:relative}
.card .band{width:100%;height:5px;flex:none}
.card .row{display:flex;align-items:center;gap:2px;margin-top:3px}
.card .ic{font-size:19px;line-height:1}
.shape{display:block;width:34px;height:22px}
.card .body{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.card .nm{font-size:10.5px;font-weight:600;line-height:1.1;hyphens:auto;-webkit-hyphens:auto;min-height:23px;display:flex;align-items:center;padding-inline:3px;overflow-wrap:anywhere}
.card .st{display:flex;gap:3px;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.card .st .a,.ocard .st .a{color:#b86500} .card .st .s,.ocard .st .s{color:#00857a}
.card .hb{font-size:9.5px;font-weight:600;color:#4b5a4f;min-height:12px}
.card .tx{display:none}
.card .meta{display:flex;flex-direction:column;align-items:center;gap:2px}
.cost{position:absolute;top:8px;right:4px;display:flex;gap:1.5px}
.cost i{width:5px;height:5px;border-radius:50%;background:var(--ink);display:block}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 7px 0 #0000004d}
.card.dragging{opacity:.4}
.card.poor{opacity:.42}
.card:disabled{cursor:default}
.dragimg{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);background:var(--paper);border-radius:12px;padding:6px 8px;
  box-shadow:0 10px 24px #000a,0 0 0 3px var(--gold);display:flex;align-items:center;gap:4px;font-size:22px}

.log{background:var(--panel);border-radius:10px;padding:8px 10px;flex-direction:column;gap:4px}
.log h4{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.log svg{display:block;width:100%;height:auto}
.log .lb{fill:var(--gold)} .log .lb.empty{fill:#ffffff12}
.log text{fill:var(--muted);font-size:9px;font-family:var(--f-body);text-anchor:middle}
.log text.v{fill:var(--text);font-weight:600}
.log .grid{stroke:#ffffff1a;stroke-width:1}
.log .past{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.log .past b{color:var(--text);font-weight:600}

.pcard .ph{font-size:12px;font-weight:600}.pcard .ph.w{color:#a35c00}.pcard .ph.g{color:#2e7d32}
.zlmap{width:100%;display:flex;justify-content:center}.zlmap svg{width:100%;max-height:240px;pointer-events:none}
body.zlpick #hand{visibility:hidden}
.overlay.zlook{background:transparent;backdrop-filter:none;align-items:flex-end;padding-bottom:20px}
.overlay{position:fixed;inset:0;background:#07170ecc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:16px;padding:16px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px #000a;animation:pop .3s ease;max-height:100%;overflow:auto}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--gold);text-wrap:balance}
.modal h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.modal p{margin:0}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.modal h3.stk{position:sticky;top:-16px;z-index:3;font-family:var(--f-display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--gold);background:var(--panel,#1d2a21);border-top:2px solid var(--gold);border-bottom:1px solid #ffffff22;padding:7px 2px 5px;margin-top:10px;display:flex;align-items:center;gap:8px}
.modal h3.stk i{font-style:normal;font-size:14px;background:var(--gold);color:#1d2a21;border-radius:99px;padding:1px 9px;margin-left:auto;font-family:inherit}
img.art{width:1.25em;height:1.25em;object-fit:contain;vertical-align:middle}
.pile{display:flex;flex-wrap:wrap;gap:5px}
.pile span{background:var(--paper);color:var(--ink);border-radius:7px;padding:2px 7px;font-size:12.5px;font-weight:600;border-left:5px solid}
.pile em{color:var(--muted);font-style:normal;font-size:13px}
.offer{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ocard{background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:0 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;overflow:hidden;box-shadow:0 4px 0 #0000004d;min-width:0}
.ocard:hover{transform:translateY(-3px)}
.ocard .band{align-self:stretch;margin-inline:-6px;min-height:22px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;padding:2px}
.ocard .ic{font-size:30px;line-height:1}
.ocard .shape{width:50px;height:30px}
.ocard .nm{font-family:var(--f-display);font-size:15px;line-height:1.1}
.ocard .tx{font-size:11.5px;line-height:1.25;color:#3b4a3f}
.ocard .st{font-size:12px;font-weight:600;display:flex;gap:6px;font-variant-numeric:tabular-nums}
.rar{font-size:10px;font-weight:600;color:#7a5a00}
.bigscore{font-family:var(--f-display);font-size:38px;color:var(--gold);font-variant-numeric:tabular-nums}
.habrow{display:flex;gap:8px;flex-wrap:wrap}
.habrow span{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.habrow i{width:14px;height:14px;border-radius:4px;display:inline-block}

@media (max-width:380px){.cnt span{font-size:19px}.card .nm{font-size:9.5px}.offer{gap:6px}.ocard .tx{font-size:10.5px}.btn{padding-inline:9px;font-size:13px}.season-name{font-size:13px}}

.money{font-weight:600;background:var(--panel2);border-radius:9px;padding:6px 9px;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap;flex:none;font-size:14px}
.money.neg{color:#ffb3b5;background:#5a1f22}
.money.pop{animation:pop .35s ease}
.progs{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow:hidden}
.prog{width:26px;height:26px;border-radius:7px;background:var(--panel2);border:0;font-size:14px;display:grid;place-items:center;color:var(--text);padding:0;flex:none}
.prog.ad{outline:2px dashed var(--gold);outline-offset:-2px}
.prog.empty{opacity:.4;border:1px dashed var(--muted);background:none;cursor:default}
.rl{position:absolute;top:9px;left:4px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 1.5px var(--paper)}
.dupc{position:absolute;top:17px;right:3px;font-size:9px;font-weight:700;color:#c0392b}
#board .rlmark{fill:var(--bad);stroke:var(--paper);stroke-width:.7;pointer-events:none}
#board .dupm{font-size:4.6px;font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none}
.badge.big{transform:translate(-50%,-118%);display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:2px 7px}
.badge .base{color:#cfd8cc;font-weight:500}

<script>
document.documentElement.lang='de';
//@@ modul: 01-regeln-karten
//ENGINE-START
const VERSION='0.77';
const DAYS=6,HAND=5,BP=4,MAXPROGS=4,MAXLVL=3,OFFER=2,MINDECK=14,MINSKIP=5;
const ROMAN=['','I','II','III'];
const SEASONS=[{name:'Frühling',target:4500},{name:'Sommer',target:32000},{name:'Herbst',target:90000},{name:'Winter',target:210000,winter:true}];
const EARLY_BONUS=5; // Taler je übrigem Tag, wenn das Saisonziel früh erreicht ist
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hk=(q,r)=>q+','+r;
let BOARD=[],ONBOARD=new Set();
function setBoard(cells){BOARD=cells.map(c=>c.slice());ONBOARD=new Set(BOARD.map(([q,r])=>hk(q,r)))}
const hexDisc=(R,cq=0,cr=0)=>{const o=[];for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(Math.abs(q+r)<=R)o.push([q+cq,r+cr]);return o};
setBoard(hexDisc(5));
const SHAPES={
  s1:{cells:[[0,0]],label:'1 Feld'},
  s2:{cells:[[0,0],[1,0]],label:'2 Felder'},
  l3:{cells:[[-1,0],[0,0],[1,0]],label:'3er-Reihe'},
  t3:{cells:[[0,0],[1,0],[0,1]],label:'Dreieck'},
  b3:{cells:[[-1,0],[0,0],[0,1]],label:'Bogen'},
  l4:{cells:[[-1,0],[0,0],[1,0],[2,0]],label:'4er-Reihe'},
  d4:{cells:[[0,0],[1,0],[0,1],[1,1]],label:'Raute'},
  z4:{cells:[[-1,0],[0,0],[0,1],[1,1]],label:'Zickzack'},
};
function rotCells(cells,rot){let c=cells.map(x=>x.slice());for(let i=0;i<((rot%6)+6)%6;i++)c=c.map(([q,r])=>[-r,q+r]);return c}
function placeCells(key,rot,q,r){return rotCells(SHAPES[CARDS[key].shape].cells,rot).map(([a,b])=>[a+q,b+r])}
const costParts=key=>{const n=SHAPES[CARDS[key].shape].cells.length,x=[];if(n===1&&hasSpec('polier')&&typeof state!=='undefined'&&state&&state.day===0)x.push(['🧱','Polier']);if(taxed(key))x.push(['💸','Teuerung']);return{n,x}};
const costOf=key=>{const p=costParts(key);if(p.n===1&&hasSpec('rb_leicht')&&CARDS[key].cat!=='verst'&&typeof state!=='undefined'&&state&&(state.free1||0)<2)return 0;return Math.max(1,p.n+p.x.length-(CARDS[key].pr==='leicht'?1:0))};
const costTxt=key=>{const p=costParts(key);return`${costOf(key)} BP${CARDS[key].pr==='leicht'?' (🪶 −1)':''}${p.x.length?` <b class="cx">(${p.x.map(e=>e[0]+' '+e[1]+': +1').join(' · ')})</b>`:''}`};
const costDots=key=>{const p=costParts(key);return'<i></i>'.repeat(p.n)+'<i class="x"></i>'.repeat(p.x.length)+(p.x.length?`<em>${p.x.map(e=>e[0]).join('')}</em>`:'')};
const taxed=key=>!!(typeof state!=='undefined'&&state&&state.zl&&CTX.zl&&CTX.zl.tax&&(CARDS[key].hab||CARDS[key].cat)===CTX.zl.tax);

const CAT={gehege:{label:'Gehege',col:'var(--c-gehege)'},attr:{label:'Attraktion',col:'var(--c-attr)'},
  essen:{label:'Gastro & Shops',col:'var(--c-essen)'},schutz:{label:'Naturschutz',col:'var(--c-schutz)'},verst:{label:'Verstärker',col:'var(--c-verst)'}};
const HAB={wasser:{label:'Wasser',icon:'💧',col:'var(--h-wasser)',terr:'Wasser'},savanne:{label:'Savanne',icon:'🌾',col:'var(--h-savanne)',terr:'Savanne'},
  wald:{label:'Wald',icon:'🌿',col:'var(--h-wald)',terr:'Wald'},wueste:{label:'Wüste',icon:'🏜️',col:'var(--h-wueste)',terr:'Wüste'},
  arktis:{label:'Arktis',icon:'🧊',col:'var(--h-arktis)',terr:'Arktis'},gebirge:{label:'Gebirge',icon:'⛰️',col:'var(--h-gebirge)',terr:'Gebirge'}};
const DEFHABS=['wasser','savanne','wald','wueste'],NEWHABS=['arktis','gebirge'];let GENHABS=null;
// Lebensräume: im Spiel aus CTX, zwischen den Zoos (kein state) aus dem gespeicherten Lauf, sonst Standard
const habsNow=()=>{const live=typeof state!=='undefined'&&state&&typeof CTX!=='undefined'&&CTX&&CTX.habs;if(live)return CTX.habs;try{const sl=activeSlot();if(sl&&sl.run&&sl.run.habs)return sl.run.habs}catch(e){}return(typeof CTX!=='undefined'&&CTX&&CTX.habs)||DEFHABS};
// Felsen und Rand für Gebirgs-Karten
const rocksNb=b=>{const own=new Set(b.cells.map(([q,r])=>hk(q,r))),seen=new Set();for(const[q,r]of b.cells)for(const[dq,dr]of DIRS){const k=hk(q+dq,r+dr);if(!own.has(k)&&TERR.get(k)==='block')seen.add(k)}return seen.size};
const edgeN=b=>cnt(b.cells,([q,r])=>isEdge(q,r));
const RARW={gewöhnlich:10,selten:5,'sehr selten':2,winter:0,saison:0,meilenstein:0};
const SEANAME=['Frühling','Sommer','Herbst','Winter'];
let CTX={winter:false,season:0,progs:[],ads:[],ev:[],boni:{},spec:[]};
// Streik: ist die Kasse im Minus, arbeiten die Spezialisten nicht (der Spekulant kostet trotzdem)
const strike=()=>!!(CTX.strike&&CTX.strike());
// Hinweis, wenn die Kasse ins Minus rutscht (beim allerersten Mal als Fenster) oder wieder auf 0 steigt
function strikeNote(before){if(!state||state.mode==='tut')return;const was=before<0,now=state.money<0;if(was===now)return;const team=(state.spec||[]).length>0;
  if(now&&!META.strikeSeen){META.strikeSeen=1;saveMeta();modal='strike';return}if(!team)return;
  state.msg=now?{title:'🪧 Dein Team streikt',text:'Die Kasse ist im Minus. Deine Spezialisten wirken nicht, bis du wieder bei 0 Talern bist.'}:{title:'✅ Dein Team arbeitet wieder',text:'Die Kasse ist wieder im Plus, deine Spezialisten wirken wieder.'};const m=state.msg;setTimeout(()=>{if(state&&state.msg===m){state.msg=null;render()}},4000)}
const derive=(p,o)=>{const n=Object.create(p);for(const k in o)Object.defineProperty(n,k,{value:o[k],writable:true,enumerable:true,configurable:true});return n};
const baseK=k=>(CARDS[k]&&CARDS[k].base)||k;
const hasSpec=id=>(CTX.spec||[]).includes(id)&&!strike();
const sea=i=>CTX.season===i;
const K=n=>CARDS[n.key];
const has=(n,t)=>(K(n).tags||[]).includes(t);
const isCat=(n,c)=>K(n).cat===c;
const isHab=(n,h)=>K(n).hab===h;
const cnt=(arr,f)=>arr.filter(f).length;
const essenMalus=nb=>0; // Gastro-Gebäude stören nur scheue Tiere
const cold=h=>h==='savanne'||h==='wueste',hot=h=>h==='arktis'||h==='gebirge';

const CARDS={
  pinguine:{icon:'🐧',cat:'gehege',hab:'wasser',shape:'s1',a:3,s:2,rar:'gewöhnlich',
    bonus:nb=>({a:CTX.winter?2:0})},
  flamingos:{icon:'🦩',cat:'gehege',hab:'wasser',shape:'s2',a:2,s:3,rar:'gewöhnlich',
    bonus:nb=>({s:cnt(nb,n=>n.key==='gruen'),a:sea(1)?1:0})},
  schildkroeten:{icon:'🐢',cat:'gehege',hab:'wasser',shape:'s1',a:1,s:3,tags:['bedroht'],rar:'gewöhnlich',text:'Bedrohte Art.'},
  seeloewen:{icon:'🦭',cat:'gehege',hab:'wasser',shape:'s2',a:5,s:1,rar:'gewöhnlich'},
  otter:{icon:'🦦',cat:'gehege',hab:'wasser',shape:'l3',a:3,s:3,rar:'gewöhnlich',
    bonus:nb=>({s:2*cnt(nb,n=>n.key==='gruen'||n.key==='wasserfall')})},
  nilpferde:{icon:'🦛',cat:'gehege',hab:'wasser',shape:'d4',a:6,s:4,tags:['bedroht'],rar:'selten',text:'Großes Gehege. Bedrohte Art.'},
  affen:{icon:'🐒',cat:'gehege',hab:'wald',shape:'s1',a:4,s:1,rar:'gewöhnlich'},
  pandas:{icon:'🐼',cat:'gehege',hab:'wald',shape:'s2',a:4,s:4,tags:['bedroht'],rar:'selten',text:'Bedrohte Art. Publikumsliebling.'},
  tiger:{icon:'🐯',cat:'gehege',hab:'wald',shape:'t3',a:6,s:3,tags:['bedroht'],rar:'selten',text:'Großes Gehege. Bedrohte Art.'},
  faultiere:{icon:'🦥',cat:'gehege',hab:'wald',shape:'s1',a:3,s:2,rar:'gewöhnlich',
    bonus:nb=>({s:cnt(nb,n=>isCat(n,'essen')||isCat(n,'attr'))?0:2})},
  woelfe:{icon:'🐺',cat:'gehege',hab:'wald',shape:'b3',a:4,s:3,rar:'gewöhnlich',
    bonus:nb=>({s:cnt(nb,n=>isCat(n,'gehege'))})},
  reptilien:{icon:'🦎',cat:'gehege',hab:'wueste',shape:'s1',a:3,s:3,rar:'gewöhnlich',text:'Ruhige Tiere, solider Artenschutz.'},
  erdmaennchen:{icon:'🦙',cat:'gehege',hab:'wueste',shape:'s1',a:3,s:1,rar:'gewöhnlich',gone:1},
  addax:{icon:'🦌',cat:'gehege',hab:'wueste',shape:'b3',a:5,s:3,tags:['bedroht'],rar:'selten'},
  kamele:{icon:'🐫',cat:'gehege',hab:'wueste',shape:'l3',a:4,s:2,rar:'gewöhnlich',text:'Großes Gehege, langgezogen.'},
  fennek:{icon:'🦊',cat:'gehege',hab:'wueste',shape:'s1',a:3,s:2,rar:'gewöhnlich',

  zebras:{icon:'🦓',cat:'gehege',hab:'savanne',shape:'t3',a:4,s:3,rar:'gewöhnlich',text:'Großes Gehege, kompakt.'},
  warzenschweine:{icon:'🐗',cat:'gehege',hab:'savanne',shape:'s1',a:2,s:2,rar:'gewöhnlich',

  geparden:{icon:'🐆',cat:'gehege',hab:'savanne',shape:'s2',a:4,s:2,tags:['bedroht'],rar:'selten',text:'Bedrohte Art.'},

  delfinshow:{icon:'🐬',cat:'attr',shape:'s2',a:6,s:0,rar:'gewöhnlich',

    mult:(nb,all)=>cnt(all,n=>isCat(n,'gehege'))>=4?{ma:1.3}:null},

  popcorn:{icon:'🍿',cat:'essen',shape:'s1',a:1,s:0,rar:'gewöhnlich',
    
    bonus:nb=>({a:5*cnt(nb,n=>n.key==='delfinshow')+2*cnt(nb,n=>isCat(n,'attr')&&n.key!=='delfinshow'),s:essenMalus(nb)})},
  eiswagen:{icon:'🍦',cat:'essen',shape:'s1',a:2,s:0,rar:'gewöhnlich',
    
    bonus:nb=>({a:(CTX.winter?1:sea(1)?3:2)*cnt(nb,n=>isCat(n,'gehege')),s:essenMalus(nb)})},
  bratwurst:{icon:'🌭',cat:'essen',shape:'s1',a:2,s:0,rar:'gewöhnlich',
    
    bonus:nb=>({a:cnt(nb,n=>isCat(n,'gehege'))+cnt(nb,n=>isHab(n,'savanne')),s:essenMalus(nb)})},
  cafe:{icon:'☕',cat:'essen',shape:'s1',a:2,s:0,rar:'gewöhnlich',
    
    bonus:nb=>({a:2*cnt(nb,n=>isCat(n,'schutz'))+(CTX.season>=2?2:0),s:essenMalus(nb)})},

    bonus:nb=>({a:nb.length,s:essenMalus(nb)})},

    bonus:nb=>({a:2*cnt(nb,n=>isCat(n,'attr')),s:essenMalus(nb)})},

  bistro:{icon:'🍽️',cat:'essen',shape:'s1',a:2,s:0,rar:'selten',
    
    bonus:nb=>({a:5*cnt(nb,n=>isHab(n,'savanne')),s:essenMalus(nb)})},
  souvenir:{icon:'🛍️',cat:'essen',shape:'s1',a:3,s:0,rar:'gewöhnlich',
    
    bonus:nb=>({a:cnt(nb,n=>isCat(n,'attr')),s:essenMalus(nb)})},

const rerollPrice=()=>3+state.shop.rerolls;
function canPay(p){return state.money>=0&&state.money>=p}
function buy(it){if(it.sold||!canPay(it.price)){Sfx.deny();return}
  if(it.kind==='prog'&&state.progs.length>=MAXPROGS){Sfx.deny();state.shop.note='Alle 4 Plätze für Förderprogramme sind belegt.';render();return}
  if(it.kind==='remove'){state.shopSub='remove';render();return}
  if(it.kind==='spec'&&(state.spec||[]).length>=MAXSPEC){Sfx.deny();state.shop.note='Alle 4 Plätze für Spezialisten sind belegt. Entlasse unten zuerst jemanden.';render();return}
  state.money-=it.price;state.stats.spent+=it.price;if(it.kind==='prog')state.stats.progs++;Sfx.till();state.shop.note=null;
  if(isMultItem(it.kind,it.key))state.multBought=(state.multBought||0)+1;
  if(it.kind==='prog'){state.progs.push(it.key);it.sold=true}
  else if(it.kind==='ad'){state.adsNext.push(it.key);it.sold=true}
  else if(it.kind==='card'){state.discard.push(it.key);it.sold=true}
  else if(it.kind==='spec'){hireSpec(it.key);it.sold=true;Sfx.win()}
  else if(it.kind==='zfix'){state.zl.fix=true;state.shop.note='Umbau fertig: Der Nachteil deines Profils gilt nicht mehr.'}
  else if(it.kind==='tv'){state.zl.tvNext=true;state.shop.note='Fernsehteam gebucht: Baue am ersten Tag der nächsten Jahreszeit mindestens 3 Gehege/Gebäude.'}
  else if(it.kind==='bp'){state.bpNext=1;state.shop.note='Saison-Bautrupp gebucht: nächste Jahreszeit +1 Baupunkt pro Tag.'}
  else if(it.kind==='dozer'){const blocks=[...TERR.entries()].filter(([k,v])=>v==='block');const[k]=blocks[Math.floor(Math.random()*blocks.length)];TERR.delete(k);state.terr=[...TERR];state.shop.note='Ein Felsen wurde weggebaggert.'}
  syncCtx();render()}
const TYPEORD=['wasser','wald','wueste','savanne','arktis','gebirge','attr','essen','schutz','verst'];
const TRAITL={beute:'Beute',raubtier:'Raubtier',scheu:'scheu',show:'Showtier',bedroht:'bedroht',gross:'groß',einmalig:'einmalig'};
function deckRows(keys,btn){const u=[...new Set(keys)].sort((a,b)=>TYPEORD.indexOf(typeOfCard(CARDS[a]))-TYPEORD.indexOf(typeOfCard(CARDS[b]))||CARDS[a].name.localeCompare(CARDS[b].name));let out='',last=null;
  for(const k of u){const c=CARDS[k],t=typeOfCard(c),n=cnt(keys,x=>x===k),col=colOf(c);
    if(t!==last){last=t;const tn=cnt(keys,x=>typeOfCard(CARDS[x])===t);const MT=MILE[t]||{icon:'🔆',label:CAT[t]?CAT[t].label:t};out+=`<div class="drh"><i style="background:${col}"></i>${MT.icon} ${MT.label} · ${tn} Karte${tn===1?'':'n'}</div>`}
    out+=`<div class="drow" style="border-left:9px solid ${col}"><span class="ic">${ic(c)}</span><span class="inf"><b>${c.name}${n>1?' ×'+n:''}</b><small><span class="dtag" style="background:${col}">${c.hab?HAB[c.hab].label:CAT[c.cat].label}</span>${c.tags.filter(x=>TRAITL[x]).map(x=>`<span class="dtr">${TRAITL[x]}</span>`).join('')}</small><small>${c.a} B · ${c.s} N · ${costTxt(k)}</small></span>${miniShape(k)}${btn(k)}</div>`}
  return`<div class="drows">${out}</div>`}
function removeCard(pile,key){const price=priced(10);if(!canPay(price)){Sfx.deny();return}const arr=state[pile],i=arr.indexOf(key);if(i<0)return;arr.splice(i,1);state.money-=price;state.stats.spent+=price;Sfx.till();state.shopSub=null;state.rmArm=null;state.shop.note=`${CARDS[key].name} wurde aus dem Deck entfernt.`;render()}
function itemHtml(it,idx,fixed){let kind,name,text,icon;
  const nxn=(seOf(state.season+1)||{name:'nächste Jahreszeit'}).name;let band='';
  if(it.kind==='prog'){const P=PROGS[it.key];kind='🏛️ Bis Zoo-Ende · ganzer Zoo';band='perm';name=P.name;text=fxHtml(P)+'<span class="tx2">wirkt auch auf bereits gebaute</span>';icon=P.icon}
  else if(it.kind==='ad'){const P=ADS[it.key];kind='⏳ Nur im '+nxn;band='temp';name=P.name;text=fxHtml(P);icon=P.icon}
  else if(it.kind==='card'){const c=CARDS[it.key];kind=`🃏 Karte fürs Deck · ${rarLabel(c)}`;band='card';name=c.name+' '+miniShape(it.key);text=`${c.a} B · ${c.s} N · ${costOf(it.key)} BP`+fxHtml(c)+`<span class="tx2">${haveTxt(inDeckN(it.key),cnt(state.buildings,b=>b.key===it.key))}</span>`;icon=c.icon}
  else if(it.kind==='spec'){const S=SPEC[it.key];kind=`👥 Spezialist · ganzer Lauf`;band='run';name=S.name;text=fxHtml(S);icon=S.icon}
  else if(it.kind==='remove'){kind='✂️ Einmalig · Deck-Pflege';band='once';name='Karte entfernen';text='Nimm eine Karte dauerhaft aus deinem Deck.';icon='✂️'}
  else if(it.kind==='bp'){kind='⏳ Nur im '+nxn;band='temp';name='Saison-Bautrupp';text=fxHtml({fx:[`+1 BP|pro Tag, nur die nächste Jahreszeit (${BP+1} statt ${BP})`]});icon='🧱'}
  else if(it.kind==='zfix'){const P=ZPROF[state.zl.prof];kind='Zoolatro · Umbau';name='Profil-Umbau';text=`Hebt den Nachteil von ${P.icon} ${P.name} für diesen Zoo auf: „${P.bad}“.`;icon='🛠️'}
  else if(it.kind==='tv'){kind='⏳ Erster Tag im '+nxn+' · Wagnis';band='temp';name='Fernsehteam';text=fxHtml({fx:['×3 B|am ersten Tag der nächsten Jahreszeit, wenn du an dem Tag mindestens 3 Gehege/Gebäude baust','×0,5 B|sonst']});icon='📺'}
  else{kind='Einmalig';band='once';name='Felsen wegbaggern';text='Entfernt einen zufälligen Felsen vom Gelände.';icon='🚜'}
  const dis=it.sold||!canPay(it.price);
  const cs=it.kind==='card'&&CARDS[it.key]?` style="border-left:7px solid ${colOf(CARDS[it.key])}"`:'';
  return`<button class="item b-${band} ${it.sold?'sold':''}"${cs} data-item="${fixed?'f':'o'}${idx}" ${dis?'disabled':''}><span class="kind">${kind}</span><span class="nm">${icon} ${name}</span><span class="tx">${text}</span><span class="price">${it.sold?'Gekauft':'🪙 '+it.price}${!it.sold&&it.sur?`<small class="sur">+${it.sur} % · ${it.sur/50+1}. Multiplikator</small>`:''}</span></button>`}

function shopHtml(){const se=seOf(state.season),nx=seOf(state.season+1);
  if(state.shopSub==='remove'){const all=[...state.deck,...state.discard,...state.hand],pr=priced(10);
    return`<h2>Welche Karte entfernen?</h2><p>Kostet 🪙 ${pr}. Die Karte verschwindet dauerhaft aus deinem Deck. Dein Deck: <b>${all.length} Karten</b>.</p>${deckRows(all,k=>`<button class="btn ${state.rmArm===k?'main':'sub'}" data-rmk="${k}">${state.rmArm===k?'Wirklich?':'Entfernen'}</button>`)}<button class="btn sub" id="mBack">Zurück</button>`}
  const debt=state.money<0?`<p style="color:#ffb3b5"><b>Du hast ${fmt(-state.money)} Taler Schulden.</b> Erst ab 0 kannst du wieder kaufen. <b>Solange du im Minus bist, streiken deine Spezialisten und wirken nicht.</b> Kredit: Schulden kosten jeden Tag 1 Taler je 10.</p>`:'';
  const L=state.ledger||{entry:0,care:0,interest:0,early:0},led=`<div class="bill"><span>Im ${se.name}:</span><span>🎟️ Eintritt ${sgn(L.entry)}</span><span class="${L.care<0?'neg':''}">🌿 Pflege ${sgn(L.care)}</span>${L.interest?`<span class="neg">🏦 Kredit ${sgn(L.interest)}</span>`:''}${L.spec?`<span class="${L.spec<0?'neg':''}">👥 Spezialisten ${sgn(L.spec)}</span>`:''}${L.early?`<span>⏱️ früh fertig ${sgn(L.early)}</span>`:''}</div>`;
  const slots=`<div class="slotrow">${state.progs.map(id=>`<span>${PROGS[id].icon} ${PROGS[id].name}</span>`).join('')||'<span>Noch keine Förderprogramme</span>'}${state.adsNext.map(id=>`<span>${ADS[id].icon} ${ADS[id].name} (${nx.name})</span>`).join('')}${state.bpNext?`<span>🧱 Saison-Bautrupp (${nx.name})</span>`:''}</div>`;
  const mk=state.market,tab=mk&&state.shopTab==='market'?'market':'shop',evs=(state.eventsNext||[]).length?`<h3>Ereignis im ${nx.name}</h3><div class="shopgrid">${state.eventsNext.map(e=>`<div class="item ev"><span class="kind">Gilt die ganze Jahreszeit, auch für bereits Gebautes</span><span class="nm">${evIcon(e)} ${evName(e)}</span><span class="tx">${fxHtml({fx:evFx(e)})}</span></div>`).join('')}</div>`:'';
  const tabs=mk?`<div class="stabs"><button class="${tab==='shop'?'on':''}" data-stab="shop">🛒 Shop <i>${cnt(state.shop.items,x=>!x.sold)}</i></button><button class="${tab==='market'?'on':''} ${mk.seen?'':'new'}" data-stab="market" title="Spezialisten: wirken den ganzen Lauf">👥 Stellenmarkt <i>${mk.bought?0:mk.items.length}</i></button></div>`:'';
  if(tab==='market')return`<h2>Saisonende · 🪙 ${fmt(state.money)}</h2>${tabs}<p class="shopd">👥 Spezialisten wirken den ganzen Lauf, über alle Zoos.</p>${debt}${marketHtml()}
    <div class="shopbar"><button class="btn sub" id="mMkRoll" ${mk.bought||!canPay(marketRoll())?'disabled':''}>🎲 Andere Bewerber · 🪙 ${marketRoll()}</button><button class="btn main" id="mLeave">Weiter zum ${nx.name}</button></div>`;
  return`<h2>${mk?'Saisonende':'Zoo-Shop'} · 🪙 ${fmt(state.money)}</h2>${tabs}${led}${debt}${state.shop.note?`<p style="color:var(--gold)">${state.shop.note}</p>`:''}
    ${evs}
    ${(()=>{const shelf=k=>['card','remove'].includes(k)?'deck':['ad','bp','tv'].includes(k)?'season':k==='spec'?'run':'zoo',fxd=fixedItems();return[['deck','🃏 Fürs Deck','Karten kommen in dein Deck und werden normal gezogen und gebaut.'],['season','⏳ Nur nächste Jahreszeit',`Wirkt nur im ${nx.name}, danach ist es vorbei.`],['zoo','🏛️ Für diesen Zoo','Wirkt bis zum Ende dieses Zoos, auch auf bereits Gebautes.'],['run','👥 Ganzer Lauf','Wirkt über alle Zoos dieses Laufs.']].map(([g,t,d])=>{const body=state.shop.items.map((it,i)=>[it,i]).filter(([it])=>shelf(it.kind)===g).map(([it,i])=>itemHtml(it,i,false)).join('')+fxd.map((it,i)=>[it,i]).filter(([it])=>shelf(it.kind)===g).map(([it,i])=>itemHtml(it,i,true)).join('');return body?`<h3>${t}</h3>${d?`<p class="shopd">${d}</p>`:''}<div class="shopgrid">${body}</div>`:''}).join('')})()}
    <h3>Förderprogramme ${state.progs.length}/${MAXPROGS}</h3>${slots}
    <div class="shopbar"><button class="btn sub" id="mReroll" ${canPay(rerollPrice())?'':'disabled'}>🎲 Neu würfeln · 🪙 ${rerollPrice()}</button><button class="btn main" id="mLeave">Weiter zum ${nx.name}</button></div>`}

  <button class="btn sub" id="mRules">${helpOpen?'▾ Spielregeln ausblenden':'▸ 📜 Spielregeln anzeigen'}</button>
  ${helpOpen?`<ul>
  <li>Jeden Morgen ziehst du 5 Karten aus deinem Deck und hast <b>4 Baupunkte</b>. Jedes Feld einer Karte kostet 1 Baupunkt.</li>
  <li>Karte aufs Gelände ziehen oder antippen und aufs Feld tippen, mit <b>↻ Drehen</b> ausrichten, dann <b>Bauen</b>. Du kannst mehrere Karten pro Tag bauen.</li>
  <li><b>Tag beenden:</b> Übrige Handkarten kommen auf die Ablage, dann zählt der ganze Zoo: <b>Summe Besucher × Summe Natur</b>.</li>
  <li>Gebaute Karten sind <b>verbraucht</b>. Für jede gebaute Karte wählst du nach dem Tag 1 von 2 neuen Karten.</li>
  <li><b>Wiederholung:</b> Die zweite Anlage derselben Art bringt nur 75 % ihrer Besucher und Natur (samt Boni), ab der dritten nur noch 25 %. Besucher wollen Abwechslung.</li>
  <li><b>Jahreszeiten-Karten:</b> Manche Karten wirken je nach Jahreszeit stärker oder schwächer, das steht auf der Karte. Blumenschau, Wasserspielplatz, Kürbisfest und die Winter-Karten gibt es nur in ihrer Jahreszeit zur Auswahl.</li>
  <li><b>Meilensteine:</b> Ab 6 verschiedenen Gehege-Arten eines Lebensraums oder 7 verschiedenen Attraktionen, 8 Gastro-Gebäuden oder 9 Naturschutz-Gebäuden bekommst du am nächsten Morgen eine besondere Karte. Sie ersetzt eine deiner fünf Handkarten. Den Fortschritt zeigt 🏅 oben neben „Saison“.</li>
  <li><b>Stress:</b> Jedes Raubtier (Löwen, Tiger, Geparden, Wölfe …) im Umkreis von 2 Feldern um ein Beutetier (Zebras, Giraffen, Lamas …) und jedes Gastro-Gebäude oder jede Attraktion im Umkreis von 2 Feldern um ein <b>scheues</b> Tier (Pandas, Faultiere, Schildkröten …) macht das Tier gestresst. Jedes gestresste Tier kostet den ganzen Zoo 5 % Natur (egal wie viele Störer), insgesamt höchstens −40 %. Picknick und Restaurant stören nicht. <b>Showtiere</b> (Seelöwen, Pinguine, Affen, Papageien, Lamas, Skorpione, Giraffen, Warzenschweine) bekommen umgekehrt +30 % je benachbartes Gastro-Gebäude oder Attraktion, höchstens +60 %. Ein <b>Tierarzt</b> daneben hebt Stress auf.</li>
  <li><b>Pause:</b> Nach jeder Auszählung kannst du dir den Zoo in Ruhe anschauen. Weiter geht es mit „Nächsten Tag starten“.</li>
  <li><b>Lebensraum:</b> +1 Besucher je benachbartes Gehege mit gleichem Lebensraum. Auf <b>Naturflächen</b> dürfen nur passende Gehege (mit +1 Natur je Feld), andere Gehege nicht. Attraktionen, Gastro-Gebäude und Naturschutz-Gebäude dürfen dort ohne Bonus stehen.</li>
  <li><b>Umziehen:</b> Gebautes antippen, dann wird der mittlere Knopf zu „🚚 Umziehen“. Neuen Platz wählen und mit „Setzen“ bestätigen. Kostet 1 Baupunkt, die Ausbaustufe bleibt. ↶ bricht vorher ab.</li>
  <li><b>Ausbauen:</b> Ziehe eine Gehege-Karte auf ein gleiches Gehege. Gleiche Kosten, +1 B und +1 N je angefangene 2 Felder pro Stufe, bis Stufe III. Zählt nicht als Wiederholung.</li>
  <li><b>Bonus-Karten:</b> Schaffst du alle vier Jahreszeiten, schaltest du 1 von 3 Bonus-Karten für deinen Speicherplatz frei.</li>
  <li><b>Speicherplätze und Verbesserungen:</b> Jeder der drei Speicherplätze hat seinen eigenen Zoo. Nach jedem beendeten Spiel verbesserst du eine Karte dauerhaft um +1 B oder +1 N (🏅, bis zu 3-mal pro Karte).</li>
  <li><b>🔍 Zoom</b> sitzt in einer freien Ecke des Geländes oder oben in der Leiste. Auf freier Fläche ziehen verschiebt den Ausschnitt. Beim Tagesende geht der Zoom aus.</li>

  <li><b>Zoolatro:</b> Zoo um Zoo wird es schwerer. Du startest mit einem Starter-Deck. Nach jedem geschafften Zoo gibt es Belohnungen: Verbesserungen, neue Karten, Aussortieren und einen Spezialisten. Jeder Zoo beginnt mit deinem Lauf-Deck; Gelände, Taler und Förderprogramme beginnen neu.</li>
  <li><b>Spezialisten</b> (nur Zoolatro): Mitarbeiter mit Sonderregel, höchstens 4, gelten für den ganzen Lauf. Du bekommst sie im Stellenmarkt 👥 (nach jeder Jahreszeit als Reiter neben dem Shop, jeweils höchstens einen) und nach jedem Zoo. 🎖️ oben zeigt dein Team.</li>
  <li><b>🔄 Neu ziehen:</b> Einmal pro Jahreszeit gratis, danach für 1 Baupunkt wirfst du die ganze Hand ab und ziehst fünf neue Karten. Zweimal tippen zum Bestätigen. Das lässt sich nicht rückgängig machen, und die Züge davor sind danach fest.</li>
  <li><b>↶ Rückgängig</b> nimmt Bauen, Ausbauen und Umziehen des heutigen Tages Schritt für Schritt zurück.</li>
  <li><b>Einmalig:</b> Gehege/Gebäude mit Bonus für den ganzen Zoo (Forschungslabor, Artenvielfalt-Institut, Zoo-Stiftung, Nachtführung) gibt es nur einmal im Zoo.</li>
  <li><b>Rote Liste</b> (roter Punkt): bedrohte Arten. Tierarzt, Zuchtstation und manche Förderprogramme belohnen sie.</li>
  <li><b>Saisonende:</b> Sobald das Ziel erreicht ist, endet die Saison. Jeder übrige Tag bringt +5 Taler.</li>
  <li><b>Geld:</b> Jeder Tag bringt 1 Taler je 9 Besucher und kostet 1 Taler je 8 Natur. Gespartes bringt keine Zinsen, Schulden kosten aber −1 je 10 Taler (Kredit).</li>
  <li><b>Shop</b> nach jeder Saison (Preise steigen jede Saison um 50 %): Förderprogramme (bis Zoo-Ende, 4 Plätze), Werbung (nur nächste Saison), seltene Karten, Karte entfernen, +1 Baupunkt. Mit Schulden kannst du nichts kaufen.</li>
  <li><b>Winter:</b> Savannen- und Wüstengehege frieren (−1 B).</li></ul>

function tPlan(key,pref,ex){const bs=state.buildings.filter(b=>b!==ex),c=CARDS[key],n=SHAPES[c.shape].cells.length,seen=new Set(),cand=[];
  for(const[q,r]of BOARD)for(let rot=0;rot<(n>1?6:1);rot++){const cells=placeCells(key,rot,q,r),k=cells.map(x=>hk(...x)).sort().join('|');if(seen.has(k))continue;seen.add(k);if(!fits(bs,cells,key))continue;cand.push({cells,k,ok:!pref||pref(cells)})}
  const pool=cand.some(x=>x.ok)?cand.filter(x=>x.ok):cand;let best=null;
